  #cats { position: fixed; left: 0; right: 0; bottom: 0; top: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  #cats[hidden] { display: none; }
  .cat { position: absolute; left: 0; bottom: 2px; width: 64px; height: 44px; pointer-events: auto; cursor: pointer; will-change: transform; }
  .cat .flip { width: 64px; height: 44px; }
  .cat svg { width: 64px; height: 44px; overflow: visible; display: block; color: var(--c); }
  .cat svg .all { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .25s; }
  .cat.loaf svg .all, .cat.purr svg .all, .cat.sleep svg .all { transform: translateY(6px) scaleY(.8) scaleX(1.06); }
  .cat.crouch svg .all { transform: translateY(5px) scaleY(.86); }
  .cat.air svg .all, .cat.land svg .all { transition-duration: .1s; }
  .cat.air.rise svg .all { transform: rotate(-9deg) scaleX(1.07) scaleY(.94); }          /* 도약: 몸을 길게 뻗는다 */
  .cat.air.rise .l2, .cat.air.rise .l4 { transform: rotate(-52deg); }                    /* 앞다리는 앞으로 */
  .cat.air.rise .l1, .cat.air.rise .l3 { transform: rotate(46deg); }                     /* 뒷다리는 뒤로 */

  .cat.land svg .all { transform: translateY(5px) scaleY(.85) scaleX(1.05); }           /* 착지: 네 발이 같이 닿으며 살짝 눌림 */

function inviteHouseBuddy(c,t) {

function updateRoomTime(date=new Date()){
  const hour=date.getHours()+date.getMinutes()/60+date.getSeconds()/3600;
  const daylight=hour>=6&&hour<18, progress=((hour-(daylight?6:18)+24)%24)/12;
  const x=10+Math.min(1,progress)*80, top=40-Math.sin(Math.min(1,progress)*Math.PI)*33;
  const night=hour<5||hour>=20?1:hour<7?(7-hour)/2:hour>17?(hour-17)/3:0;
  const root=document.documentElement;root.style.setProperty('--night',Math.max(0,Math.min(1,night)).toFixed(3));
  root.style.setProperty('--reflection-x',x+'%');
  root.style.setProperty('--sun-angle',`${-30+progress*60}deg`);root.style.setProperty('--warmth',daylight?(hour<9||hour>16?.85:.4):.04);
  for(const[id,visible]of[['sun',daylight],['moon',!daylight]]){$(id).hidden=!visible;$(id).style.left=x+'%';$(id).style.top=top+'%';}
  $('roomClock').textContent=date.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+(night>.7?' · 달빛의 방':hour>16?' · 노을의 방':' · 바다의 방');
  document.body.dataset.time=night>.7?'night':'day';
  $('rain-friend').classList.toggle('visible',roomWeather==='rain'&&date.getMinutes()%20<12);
  const dateKey=`${date.getFullYear()}-${date.getMonth()+1}-${date.getDate()}-${Math.floor(hour*2)}`;
  if(dateKey!==lastRoomDate){lastRoomDate=dateKey;if(weatherChoice==='auto')setRoomWeather('auto',date);}
}
function setRoomWeather(choice,date=new Date()){
  weatherChoice=choice;
  if(choice==='auto'){
    // A stable, half-hour story-weather slot shared by reloads; no location permission.
    const key=Math.floor(date.getTime()/1800000), value=((key*9301+49297)%233280)/233280;
    roomWeather=value<.62?'clear':value<.88?'rain':value<.98?'snow':'hail';
  }else roomWeather=choice;
  document.body.dataset.weather=roomWeather;
  $('rain-friend').classList.toggle('visible',roomWeather==='rain'&&date.getMinutes()%20<12);
}
function drawWeather(t){
  if(reduceMotion)t=0;
  tickRoomEvents();
  const canvas=$('weatherCanvas'),ctx=canvas.getContext('2d'),rect=canvas.getBoundingClientRect();
  if(canvas.width!==Math.round(rect.width)||canvas.height!==Math.round(rect.height)){canvas.width=Math.round(rect.width);canvas.height=Math.round(rect.height);}
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(roomWeather!=='clear'){
    const snow=roomWeather==='snow',hail=roomWeather==='hail',speed=snow?18:hail?160:230;
    ctx.strokeStyle='rgba(224,241,247,.65)';ctx.fillStyle=snow?'#fffcf1dc':'#eef8f9d9';ctx.lineWidth=1;
    for(let i=0;i<(snow?45:65);i++){
      const x=((i*137.2+Math.sin(t/2000+i)*(snow?14:2))%Math.max(1,canvas.width));
      const yy=(i*71+t/1000*speed)%Math.max(1,canvas.height);
      if(snow||hail){ctx.beginPath();ctx.arc(x,yy,snow?1.8:2.6,0,Math.PI*2);ctx.fill();}
      else{ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x-4,yy+13);ctx.stroke();}
    }
  }
  weatherFrame=requestAnimationFrame(drawWeather);
}
function beginMeal(now=Date.now()){
  if(eventState||reduceMotion)return false;
  const door=$('orangeDoor').getBoundingClientRect();
  eventState={kind:'meal',start:now,served:false,doorX:door.left+door.width/2-90};$('orangeDoor').classList.add('open');$('status').textContent='주황색 문이 열렸어요. 작은 친구들이 밥을 차리러 왔어요.';return true;
}
function beginBus(now=Date.now()){
  if(eventState||reduceMotion)return false;
  const passengers=cats.filter(c=>!c.air&&!['angel','bubble'].includes(c.mode)).slice(0,4);
  if(!passengers.length)return false;
  eventState={kind:'bus',start:now,passengers,boarded:false};$('status').textContent='고양이버스가 바다 드라이브를 왔어요.';return true;
}
function tickRoomEvents(now=Date.now()){
  if(bowlsUntil && now>bowlsUntil){$('bowls').classList.remove('visible');bowlsUntil=0;}
  if(!eventState){
    if(now>=nextMealAt&&!document.hidden&&!reduceMotion){nextMealAt=now+FIFTY_MINUTES;beginMeal(now);}
    else if(now>=nextBusAt&&!document.hidden&&!reduceMotion){nextBusAt=now+(18+Math.random()*12)*60000;beginBus(now);}
    return;
  }
  const e=eventState,sec=(now-e.start)/1000;
  if(e.kind==='meal'){
    const progress=sec<6?Math.min(1,sec/6):sec<25?1:Math.max(0,1-(sec-25)/6);
    const x=e.doorX+(innerWidth*.26-e.doorX)*progress;
    $('visitors').style.left=x+'px';$('visitors').style.opacity=String(Math.min(1,progress*3));$('visitors').style.transform=`scale(${.25+.75*progress})`;
    if(sec>=8&&!e.served){e.served=true;bowlsUntil=now+120000;$('bowls').classList.add('visible');cats.forEach((c,i)=>{if(!c.air&&c.mode!=='bubble'){leave(c,performance.now());c.goal=null;c.edge=null;c.foodTarget=innerWidth*(.23+i*.065);c.zoom=0;if(nodeOf(c)===GROUND){c.tx=c.foodTarget;c.foodTarget=null;c.favorite='eat';setMode(c,'goFavorite',performance.now(),45000);}else travelTo(c,GROUND,performance.now());}});}
    if(sec>=32){$('orangeDoor').classList.remove('open');$('visitors').style.left='-230px';eventState=null;$('status').textContent='맛있게 먹고, 또 느긋하게 놀아요.';}
  }else{
    const bus=$('catbus'),target=Math.max(20,innerWidth/2-140);
    const x=sec<5?-320+(target+320)*sec/5:sec<10?target:sec<20?target+(innerWidth+320-target)*Math.min(1,(sec-10)/5):sec<25?-320+(target+320)*(sec-20)/5:sec<31?target:target+(innerWidth+320-target)*Math.min(1,(sec-31)/5);
    bus.style.left=x+'px';
    if(sec>=6&&!e.boarded){e.boarded=true;e.passengers.forEach(c=>{leave(c,performance.now());c.goal=null;c.edge=null;c.air=false;c.mode='busRide';c.el.classList.add('bus-passenger');});
      bus.querySelector('.bus-riders').replaceChildren(...e.passengers.map((c,i)=>{const face=c.el.cloneNode(true);face.className='cat '+c.lookCls+' bus-face';face.style.transform='';face.removeAttribute('id');face.querySelectorAll('.bubble,.note').forEach(el=>el.remove());const svg=face.querySelector('svg');svg.setAttribute('viewBox','26 0 42 40');svg.innerHTML=svg.innerHTML.replaceAll('cat-'+cats.indexOf(c)+'-', 'rider-'+i+'-');return face;}));}
    if(sec>=26&&e.passengers.length){e.passengers.forEach((c,i)=>{c.el.classList.remove('bus-passenger');c.x=Math.max(0,Math.min(innerWidth-CAT_W,target+40+i*45));c.y=0;c.air=false;c.stand=null;c.until=performance.now()+2000;c.mode='watch';});e.passengers=[];bus.querySelector('.bus-riders').innerHTML='';}
    if(sec>=37){eventState=null;bus.style.left='-320px';$('status').textContent='바다 한 바퀴, 다녀왔어요 ♡';}
  }
}
function initRoom(){

  $('restBtn').onclick=()=>{const t=performance.now();cats.forEach(c=>{if(!c.air&&!['angel','bubble','busRide'].includes(c.mode)){leave(c,t);if(!chooseFavorite(c,t))sleepNow(c,t);}});$('status').textContent='각자 좋아하는 폭신한 자리로 가요.';};
  $('wingsBtn').onclick=()=>{if(reduceMotion){$('status').textContent='움직임을 켜면 로이와 동글이가 날개를 펼쳐요.';return;}const t=performance.now();cats.filter(c=>['로이','동글이'].includes(c.name)).forEach(c=>{c.angelAfter=0;c.restUntil=0;if(!c.air)startAngelFlight(c,t);});};
  updateRoomTime();nextMealAt=Date.now()+FIFTY_MINUTES;nextBusAt=Date.now()+(18+Math.random()*12)*60000;

  weatherFrame=requestAnimationFrame(drawWeather);
}

const hOf = (p, cx) => p.hAt ? p.hAt(cx) : p.h;

// 실제 발판 충돌과 화면 경계를 미리 확인해 출발한 칸으로 돌아오는 점프를 제외한다.

  for (const lx of launchPoints) {
    const targets = Q === GROUND ? [-200, -130, -70, 70, 130, 200].map(d => Math.max(u, Math.min(v, lx + d))) : [...new Set([...samples(u,v), Math.max(u,Math.min(v,lx))])];

      const sy = hOf(P, lx), dy = hOf(Q, tx) - sy;

          if (y <= h) return (floor || GROUND) === Q;
        }
        return false;
      };
      if (![1 / 30, 1 / 60, 1 / 120].every(lands)) continue;
      const score = Math.abs(tx - lx) + Math.abs(lx - P.xc) * .2 + tf * 30;

// 목표 칸까지 몇 단계인지 (역방향 BFS)
function distTo(goal) {

  const d = new Map([[goal, 0]]), q = [goal];
  while (q.length) {
    const g = q.shift();
    for (const P of nodes) if (!d.has(P) && P.out.some(e => e.to === g)) { d.set(P, d.get(g) + 1); q.push(P); }
  }

const nodeOf = c => (c.stand && c.stand.node) ? c.stand : GROUND;
const isHigh = c => !!(c.stand && c.stand.node);
function launchX(P, Q, cx) {
  const lo = Math.max(P.x0, Q.x0, CAT_W / 2 + 2), hi = Math.min(P.x1, Q.x1, innerWidth - CAT_W / 2 - 2);
  if (hi - lo >= 16) return Math.min(hi - 8, Math.max(lo + 8, cx));     // 위아래로 겹치면 그 자리에서 점프
  return Math.max(CAT_W / 2 + 2, Math.min(innerWidth - CAT_W / 2 - 2, Q.xc > P.xc ? P.x1 - 12 : P.x0 + 12));   // 옆 칸이면 가장자리에서 도약
}

      case 'tunnel': pose = 'tunnel'; break;
      case 'eat': pose = 'eat'; break;
      case 'house-low': case 'house-top': case 'bed': case 'hammock': case 'sofa': case 'chin': pose = c.mode + ' sleep'; break;
      case 'roll': pose = 'roll'; break;
      case 'walk': c.x += c.dir * c.speed * (c.name === '보리' ? .66 : .82) * dt; pose = 'walking'; break;
      case 'loaf': pose = 'loaf'; break;
      case 'groom': pose = 'groom'; break;
      case 'sleep':
        pose = 'sleep';
        if (t > (c.noteAt || 0)) {
          c.noteAt = t + 2200 + rnd(0, 1500);
          const z = document.createElement('span'); z.className = 'note'; z.textContent = 'z'; z.style.fontSize = '12px';
          z.style.left = '40px'; c.el.appendChild(z); setTimeout(() => z.remove(), 1400);
        }
        break;
      case 'alert':
        pose = 'alert';
        if (mouseOn) c.dir = mouse.x < cx ? -1 : 1;
        break;
      case 'purr':
        pose = 'purr';
        if (t > (c.noteAt || 0)) {
          c.noteAt = t + 650;
          const n = document.createElement('span'); n.className = 'note'; n.textContent = '♪';
          n.style.left = rnd(12, 36) + 'px'; c.el.appendChild(n); setTimeout(() => n.remove(), 1400);
        }
        break;
      case 'goto': {   // 쿠션으로 가서 꾹꾹이
        const dx = c.tx - cx;
        if (Math.abs(dx) < 5) { c.noteAt = 0; setMode(c, 'knead', t, rnd(4500, 8000)); say(c, '꾹꾹꾹~', 1400); break; }
        c.dir = dx < 0 ? -1 : 1; c.x += c.dir * 60 * dt; pose = 'walking'; break;
      }
      case 'knead':
        pose = 'knead';
        if (t > (c.noteAt || 0)) {
          c.noteAt = t + 1100;
          const h = document.createElement('span'); h.className = 'note'; h.textContent = '♡';
          h.style.left = rnd(30, 44) + 'px'; c.el.appendChild(h); setTimeout(() => h.remove(), 1400);
        }
        break;
      case 'travel': {   // 목표 칸까지 걷거나 달리고 점프로 이동 (우다다 중이면 쉬지 않고 다음 칸으로)
        if (c.air) break;
        let here = nodeOf(c);
        if (!c.goal || here === c.goal) {
          if (c.foodTarget && here === GROUND) { c.tx=c.foodTarget; c.foodTarget=null; c.favorite='eat'; c.goal=null; c.zoom=0; setMode(c,'goFavorite',t,30000); break; }
          if (c.cozy && here === c.cozy.platform) { c.tx = c.cozy.xc; c.goal = null; c.zoom = 0; setMode(c, 'goFavorite', t, 45000); break; }
          if (c.zoom > 1) {
            c.zoom--; const g = zoomGoal(c, here);
            if (g) { c.goal = g; c.edge = null; if (Math.random() < .3) say(c, SHOUTS[Math.floor(Math.random() * SHOUTS.length)], 900); }
          }
          if (!c.goal || here === c.goal) {
            if (c.zoom) say(c, '헥헥…', 1300);
            c.goal = null; c.zoom = 0; setMode(c, 'sit', t, rnd(900, 2200)); break;
          }
        }
        const goal = c.goal, run = c.zoom ? 1 : 0;
        if (!c.edge || c.edge.from !== here) {
          const d = distTo(goal), mine = d.get(here);
          const opts = mine == null ? [] : here.out.filter(e => d.get(e.to) < mine && !(c.blockedRoute?.until > t && c.blockedRoute.from === here && c.blockedRoute.to === e.to));
          if (!opts.length) { c.goal = null; c.zoom = 0; setMode(c, 'sit', t, 1000); break; }
          const e = c.edge = { ...opts[Math.floor(Math.random() * opts.length)], t0: t, progressAt: t, progressX: cx };

        }
        const e = c.edge, to = e.to;
        if (Math.abs(cx - e.progressX) > 6) { e.progressX = cx; e.progressAt = t; }
        if (t - e.progressAt > 3000) { c.goal = null; c.edge = null; c.zoom = 0; setMode(c, 'sit', t, 1000); break; }   // 실제 이동이 멈췄을 때만 쉬기 (긴 다리는 천천히 끝까지 걷는다)
        if (e.type === 'walk') {
          const dx = (to === GROUND ? (here.lowDir || 1) * 1e3 : to.xc - cx);
          c.dir = dx < 0 ? -1 : 1; c.x += c.dir * (run ? 115 : 30) * dt; pose = run ? 'walking fast' : 'walking';
        } else {
          const { lx, tx } = e.plan;
          const dx = lx - cx;
          if (Math.abs(dx) < .6) {
            if (!c.wind) c.wind = t + 160;   // 뛰기 전에 잠깐 웅크린다
            if (t < c.wind) { pose = 'crouch'; break; }
            c.wind = 0; c.x = lx - CAT_W / 2; c.y = hOf(here,lx); jumpTo(c, to, tx, t); c.edge = null; break;
          }
          c.dir = dx < 0 ? -1 : 1; c.x += c.dir * Math.min(Math.abs(dx), (run ? 125 : 36) * dt); pose = run ? 'walking fast' : 'walking';
        }
        break;
      }
      case 'goWheel': {   // 캣휠 안으로 들어가 달리기
        const dx = c.tx - cx;
        if (!wheel) { setMode(c, 'sit', t, 1000); break; }
        if (Math.abs(dx) < 5 && c.stand?.kind === 'wheel') { c.dir = 1; setMode(c, 'run', t, rnd(6000, 12000)); say(c, '두두두두!', 1400); break; }
        c.dir = dx < 0 ? -1 : 1; c.x += c.dir * 60 * dt; pose = 'walking'; break;
      }
      case 'run':   // 제자리 달리기 (바퀴 안에서 앞뒤로 조금씩 흔들림)
        if (!wheel) { setMode(c, 'sit', t, 1000); break; }
        c.x = wheel.xc - CAT_W / 2 + Math.sin(t / 160) * 6; pose = 'walking fast'; break;
      case 'goScratch': {   // 캣타워 기둥 앞으로 가서 스크래칭
        const dx = c.tx - cx;
        if (Math.abs(dx) < 4) { c.x = c.tx - CAT_W / 2; c.noteAt = 0; setMode(c, 'scratch', t, rnd(4000, 7500)); say(c, '벅벅벅~', 1300); break; }
        c.dir = dx < 0 ? -1 : 1; c.x += c.dir * 70 * dt; pose = 'walking'; break;
      }
      case 'scratch':
        pose = 'scratch';
        if (t > (c.noteAt || 0)) {
          c.noteAt = t + 240;
          const f = document.createElement('span'); f.className = 'fluff'; f.textContent = '·';
          f.style.setProperty('--fx', (c.dir > 0 ? -1 : 1) * rnd(8, 22) + 'px'); f.style.left = rnd(24, 34) + 'px';
          c.el.appendChild(f); setTimeout(() => f.remove(), 800);
        }
        break;
      case 'stalk': {
        if (!mouseOn) { setMode(c, 'sit', t, 1000); break; }
        const dx = mouse.x - cx; c.dir = dx < 0 ? -1 : 1;
        if (Math.abs(dx) < 130) { setMode(c, 'freeze', t, 450); say(c, '...!', 500); break; }
        c.x += c.dir * 45 * dt; pose = 'walking crouch'; break;
      }
      case 'freeze': pose = 'crouch'; if (mouseOn) c.dir = mouse.x < cx ? -1 : 1; break;
      case 'dash': {
        const dx = mouse.x - cx; c.dir = dx < 0 ? -1 : 1;
        if (!mouseOn || Math.abs(dx) < 30) { pounce(c, t, ground - mouse.y - c.y); break; }
        c.x += c.dir * 190 * dt; pose = 'walking fast'; break;
      }
      case 'chase': case 'flee': {
        const p = c.partner;
        if (!p) { setMode(c, 'sit', t, 1000); break; }
        const dx = (p.x + CAT_W / 2) - cx;
        c.dir = (c.mode === 'chase' ? 1 : -1) * (dx < 0 ? -1 : 1);
        const atWall = c.mode === 'flee' && ((c.x <= 2 && c.dir < 0) || (c.x >= max - 2 && c.dir > 0));
        if (atWall) c.dir *= -1;   // 벽에 몰리면 반대로 빠져나감
        c.x += c.dir * (c.mode === 'chase' ? 120 : 105) * dt; pose = 'walking fast';
        if (c.mode === 'chase' && Math.abs(dx) < 26) {   // 잡았다! 술래 교대
          say(c, '잡았다!', 900); say(p, '으앗!', 900);
          c.mode = 'flee'; p.mode = 'chase';
          c.x += c.dir * -40;
        }
        break;
      }
    }
    if (c.x < 0) { c.x = 0; if (c.mode === 'walk') c.dir = 1; } else if (c.x > max) { c.x = max; if (c.mode === 'walk') c.dir = -1; }

    // 물리: 점프/낙하와 발판(쿠션·타워·다리·경사로) 위에 서기
    const fcx = c.x + CAT_W / 2;
    if (c.mode === 'angel') { /* 날개 비행은 곡선을 따라가고 도착할 때 발판에 내려앉는다. */ }
    else if (c.air) {
      const prevY = c.y;
      c.vy -= G * dt; c.y += c.vy * dt; c.x = Math.max(0, Math.min(max, c.x + c.vx * dt));
      if (c.vy < 0) {
        const p = floorAt(c.x + CAT_W / 2, prevY, 1), fy = p ? hOf(p, c.x + CAT_W / 2) : 0;
        if (c.y <= fy) { c.y = fy; c.vy = 0; c.vx = 0; c.air = false; c.stand = p; c.landT = t; onLand(c, t); }
      }
    } else {
      const p = floorAt(fcx, c.y, 14), fy = p ? hOf(p, fcx) : 0, d = fy - c.y;
      if (Math.abs(d) <= 14) c.y = Math.abs(d) < .6 ? fy : c.y + Math.sign(d) * Math.min(Math.abs(d), 220 * dt);
      else { c.air = true; c.vy = 0; c.vx = 0; }   // 발판 가장자리를 벗어나면 떨어짐
      c.stand = p;
    }
    if (c.air) pose = 'air ' + (c.vy > 0 ? 'rise' : 'fall');
    if (wheel && c === cats[0]) wheel.el.classList.toggle('spin', cats.some(o => o.mode === 'run'));

    if (['watch','pawWrap'].includes(c.mode) && mouseOn && Math.abs(mouse.x - cx) < 130 && Math.random() < dt * .4) setMode(c, 'kiss', t, 2800);
    const cls = 'cat ' + c.lookCls + (c.earUntil > t ? ' airplane-ears' + (c.earDir < 0 ? ' ear-left' : ' ear-right') : '') + (c.name === '보리' ? ' tiger-walk' : '') + (c.cozy && c.mode === c.favorite ? ' at-cozy' : '') + ' ' + (c.mode === 'sit' && !c.air ? '' : pose) + (t - (c.landT || -1e9) < 200 && !c.air ? ' land' : '') + (pose.includes('crouch') || c.mode === 'freeze' ? ' crouch' : '');
    if (cls !== c.cls) { c.cls = cls; c.el.className = cls; }
    c.el.style.transform = `translate(${c.x.toFixed(1)}px, ${(-c.y).toFixed(1)}px)`;
    c.el.firstChild.style.transform = `scale(${(c.dir < 0 ? -1 : 1) * c.scale}, ${c.scale})`;
  }
}
$('catBtn').onclick = () => {
  catsOn = !catsOn;
  try { localStorage.setItem(KEY + ':cats', catsOn ? 'on' : 'off'); } catch (e) {}
  renderCats();
};
let resizeT;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(layoutProps, 200); });
layoutProps();
requestAnimationFrame(tickCats);


renderCats();
initRoom();
</script></body></html>
