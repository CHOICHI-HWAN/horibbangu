* { box-sizing:border-box; }
body { margin:0; height:100dvh; overflow:hidden; color:var(--ink); font:14px/1.5 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:var(--wall); }

/* Open balcony: one uninterrupted landscape, with sheer curtains and a low clear rail. */
.balcony-opening {left:17%;width:66%;top:8%;height:62%;padding:9px;border-radius:20px 20px 5px 5px;box-shadow:0 11px 0 #c8bdab,0 20px 35px #8c735722;}

.balcony-opening::before {left:-18px;clip-path:polygon(0 0,100% 0,70% 70%,92% 100%,10% 97%);}

.balcony-step {position:absolute;left:15.5%;width:69%;top:68.5%;height:5.8%;background:repeating-linear-gradient(90deg,transparent 0 90px,#c3b8a43b 91px 92px),linear-gradient(#e3ddcd,#cbc3b1);clip-path:polygon(2.5% 0,97.5% 0,100% 100%,0 100%);box-shadow:0 4px #b7ab96;}
.art-wall {width:12%;gap:22px;} .art-left{left:2.5%;}.art-right{right:2.5%;}

 .balcony-opening{left:7%;width:86%;top:27%;height:42%;padding:6px;border-radius:12px 12px 4px 4px;}

/* A quiet scene by default; controls are revealed by a background tap or keyboard. */
.room-header,.login-link,.scene-label,.weather-control {display:none;pointer-events:none;}
.controls-visible .room-header,.controls-visible .login-link,.controls-visible .scene-label,.controls-visible .weather-control {display:flex;}
.controls-visible .login-link,.controls-visible .weather-control,.controls-visible .header-actions {pointer-events:auto;}
.room:focus-visible {outline:2px solid #a2ad87;outline-offset:-5px;}
.room {--wall:#f3ebd9;background:radial-gradient(ellipse at 62% 37%,#fff8e499,transparent 60%),linear-gradient(95deg,#d7d3b21a,transparent 27%,transparent 75%,#d4b98c18),var(--wall);}
.floor {background:repeating-linear-gradient(91deg,transparent 0 17%,#947c4f26 17.08% 17.2%),linear-gradient(#b6a580,#d6c39c 7%,#e7d4b0);border-top-color:#e8ddbe;}
.sunbeam {background:linear-gradient(110deg,#fff6c965,#f8c56a00 77%);filter:blur(7px);}
.painting {background:linear-gradient(125deg,#98805b,#d6bf8b 45%,#a28b5e);box-shadow:1px 3px 7px #64563c24;}
.room-page .room-furniture svg,.room-page .cozy svg {filter:drop-shadow(0 1px 1px #6d62441a);}
.room-page .cat> .flip >svg {filter:drop-shadow(0 1.2px .7px #5b563519);}
button,.login-link,.download-link,.weather-control select {background:#fff9e8de;border-color:#a99a704c;color:#58644c;box-shadow:0 1px 0 #fffbe6;}
@media(prefers-reduced-motion:reduce){.room-header,.login-link,.scene-label,.weather-control{transition:none;}}

.room::before {content:"";position:absolute;inset:0;z-index:8;pointer-events:none;opacity:.18;mix-blend-mode:multiply;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22180%22%20height%3D%22180%22%3E%3Cfilter%20id%3D%22n%22%3E%3CfeTurbulence%20type%3D%22fractalNoise%22%20baseFrequency%3D%22.7%22%20numOctaves%3D%223%22%20stitchTiles%3D%22stitch%22%2F%3E%3CfeColorMatrix%20type%3D%22saturate%22%20values%3D%220%22%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20filter%3D%22url%28%23n%29%22%20opacity%3D%22.15%22%2F%3E%3C%2Fsvg%3E");}

/* A gentle camera breath and independently rippling painted water. */
.landscape-motion {position:absolute;inset:0;transform-origin:50% 0;animation:landscape-breathe 32s ease-in-out infinite;}
#lakeCanvas {position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
@keyframes landscape-breathe {0%,100%{transform:scale(1.003);}50%{transform:scale(1.018);}}
.shimmer {top:65%;height:35%;opacity:.28;animation:lake-light 7s ease-in-out infinite;}
@keyframes lake-light {0%,100%{transform:translateX(-5px) scaleX(.9);opacity:.18;}50%{transform:translateX(6px) scaleX(1.08);opacity:.36;}}
[data-motion="paused"] .landscape-motion,[data-motion="paused"] .shimmer {animation:none;}

/* Clouds and mountain mist drift independently over the painted landscape. */
#landscapeAir {position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:hidden;}
.sky-cloud,.mountain-mist {transform-box:view-box;transform-origin:center;}
.cloud-near {animation:cloud-drift 46s ease-in-out infinite alternate;animation-delay:-15s;}
.cloud-far {opacity:.65;animation:cloud-drift 68s ease-in-out infinite alternate-reverse;animation-delay:-34s;}
.mist-high {animation:mist-drift 35s ease-in-out infinite alternate;animation-delay:-11s;}
.mist-low {opacity:.8;animation:mist-drift 47s ease-in-out infinite alternate-reverse;animation-delay:-24s;}
@keyframes cloud-drift {from{transform:translate(-34px,0);}to{transform:translate(55px,6px);}}
@keyframes mist-drift {from{transform:translate(-65px,4px);opacity:.5;}to{transform:translate(60px,-6px);opacity:.95;}}
[data-motion="paused"] .sky-cloud,[data-motion="paused"] .mountain-mist {animation-play-state:paused;}

/* A small paper calendar on the wall, updated from the device's local date. */
.wall-calendar {position:absolute;right:4.2%;top:12px;width:106px;padding:8px 7px 7px;border:1px solid #c5b18d;border-radius:3px 3px 8px 3px;background:linear-gradient(105deg,#fff9e9,#f1e7cd);box-shadow:1px 4px 5px #72604724;transform:rotate(2deg);color:#6b6853;pointer-events:none;}
.calendar-rings {position:absolute;top:-5px;left:22%;right:22%;height:9px;background:repeating-linear-gradient(90deg,#958674 0 2px,transparent 2px 13px);border-radius:2px;}
.calendar-header {display:flex;flex-direction:column;align-items:center;border-bottom:1px solid #d6c4a1;padding:2px 0 5px;gap:2px;}
.calendar-caption {font-size:6px;color:#aa8c69;letter-spacing:1px;}
#calendarMonth {font-size:11px;color:#727e62;font-family:Georgia,'Apple SD Gothic Neo',serif;white-space:nowrap;}
.calendar-weekdays,.calendar-days {display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:8px;line-height:15px;}
.calendar-weekdays {font-size:7px;color:#9a917a;padding-top:3px;}
.calendar-days>span {min-height:15px;}
.calendar-weekdays>span:first-child,.calendar-days>span:nth-child(7n+1) {color:#b78271;}
.calendar-weekdays>span:last-child,.calendar-days>span:nth-child(7n) {color:#7b9296;}
.calendar-days .calendar-today {border-radius:50%;background:#819073;color:#fff9e6!important;box-shadow:0 0 0 1px #6b7c5a44;}
@media(max-width:650px){.wall-calendar{right:3%;top:7.5%;width:72px;padding:5px 4px 4px;}.calendar-caption{font-size:4px;letter-spacing:.5px;}#calendarMonth{font-size:8px;}.calendar-header{padding-bottom:2px;gap:0;}.calendar-weekdays,.calendar-days{font-size:6px;line-height:9px;}.calendar-days>span{min-height:9px;}.calendar-weekdays{font-size:5px;padding-top:2px;}.calendar-rings{height:7px;top:-4px;}}
@media(max-height:500px){.wall-calendar{top:8px;right:4%;width:70px;padding:4px;}.calendar-caption{display:none;}#calendarMonth{font-size:8px;}.calendar-weekdays,.calendar-days{font-size:6px;line-height:8px;}.calendar-days>span{min-height:8px;}}

  #cats { position: fixed; left: 0; right: 0; bottom: 0; top: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  #cats[hidden] { display: none; }
  .cat { position: absolute; left: 0; bottom: 2px; width: 64px; height: 44px; pointer-events: auto; cursor: pointer; will-change: transform; }
  .cat .flip { width: 64px; height: 44px; }
  .cat svg { width: 64px; height: 44px; overflow: visible; display: block; color: var(--c); }
  .cat svg .all { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .25s; }
  .cat.loaf svg .all, .cat.purr svg .all, .cat.sleep svg .all { transform: translateY(6px) scaleY(.8) scaleX(1.06); }
  .cat.crouch svg .all { transform: translateY(5px) scaleY(.86); }
  .cat.air svg .all, .cat.land svg .all { transition-duration: .1s; }
  .cat.air.rise svg .all { transform: rotate(-9deg) scaleX(1.07) scaleY(.94); }          /* 도약: 몸을 길게 뻗는다 */
  .cat.air.rise .l2, .cat.air.rise .l4 { transform: rotate(-52deg); }                    /* 앞다리는 앞으로 */
  .cat.air.rise .l1, .cat.air.rise .l3 { transform: rotate(46deg); }                     /* 뒷다리는 뒤로 */
  .cat.air.fall svg .all { transform: rotate(2deg); }                                   /* 하강: 몸을 수평으로 */
  .cat.air.fall .l2, .cat.air.fall .l4 { transform: rotate(-10deg); }                    /* 네 발을 아래로 모은다 */
  .cat.air.fall .l1, .cat.air.fall .l3 { transform: rotate(9deg); }
  .cat.land svg .all { transform: translateY(5px) scaleY(.85) scaleX(1.05); }           /* 착지: 네 발이 같이 닿으며 살짝 눌림 */
  .cat.loaf .leg, .cat.purr .leg, .cat.sleep .leg { opacity: 0; }
  .cat svg { transform-origin: 50% 100%; }
  .cat.purr svg { animation: buzz .14s infinite; }
  .cat.sleep svg { animation: breathe 3.2s ease-in-out infinite; }
  #props { position: absolute; inset: 0; pointer-events: none; }
  .cushion { position: absolute; bottom: 3px; width: 64px; height: 15px; border-radius: 12px 12px 7px 7px;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.13), 0 1px 0 rgba(0,0,0,.18); }
  .cushion::after { content: ''; position: absolute; left: 7px; right: 7px; top: 5px; border-top: 1.5px dashed rgba(255,255,255,.65); }
  .tower { position: absolute; bottom: 0; width: 130px; opacity: .94; }
  .bridges { position: absolute; left: 0; bottom: 0; }
  .cat .head { transform-box: fill-box; transform-origin: 40% 100%; transition: transform .2s; }
  .cat.groom .head { transform: rotate(32deg); animation: lick .5s ease-in-out infinite; }
  .cat.groom .l4 { transform: rotate(-68deg); animation: lickleg .5s ease-in-out infinite; }
  .cat.knead .l3 { animation: press .55s ease-in-out infinite; }
  .cat.knead .l4 { animation: press .55s ease-in-out infinite reverse; }
  .cat.knead svg { animation: bob .55s ease-in-out infinite; }
  @keyframes lick { 0%, 100% { transform: rotate(28deg); } 50% { transform: rotate(40deg); } }
  @keyframes lickleg { 0%, 100% { transform: rotate(-72deg); } 50% { transform: rotate(-58deg); } }
  @keyframes press { 0%, 100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-2px) scaleY(.55); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(1.5px); } }
  .cat.scratch svg .all { transform-origin: 25% 100%; transform: rotate(-58deg); }
  .cat.scratch svg { animation: scrw .4s ease-in-out infinite; }
  .cat.scratch .l3 { animation: scr .4s ease-in-out infinite; }
  .cat.scratch .l4 { animation: scr .4s ease-in-out infinite reverse; }
  .cat .fluff { position: absolute; bottom: 30px; left: 28px; font-size: 13px; color: #c9a27a; animation: fluff .8s forwards; }
  @keyframes scr { 0%, 100% { transform: translateY(-3px); } 50% { transform: translateY(3px); } }
  @keyframes scrw { 0%, 100% { transform: translateX(-.8px); } 50% { transform: translateX(.8px); } }
  @keyframes fluff { from { opacity: 1; transform: translate(0, 0); } to { opacity: 0; transform: translate(var(--fx, -14px), 12px); } }
  .wheel { position: absolute; bottom: 0; left: 14px; width: 120px; height: 124px; }

    const key=Math.floor(date.getTime()/1800000), value=((key*9301+49297)%233280)/233280;

// Animate only the painted lake reflections; the village and mountains stay solid.
let lastLakeFrame=-Infinity,lastWeatherFrame=-Infinity;
let sceneDimensions=null,lakePaint=null,weatherPaint=null;
function drawLake(t){
  const canvas=$('lakeCanvas'),image=$('landscape');
  if(!canvas||!image||!image.complete||!image.naturalWidth)return;
  const dimensions=sceneDimensions||(sceneDimensions={width:image.clientWidth,height:image.clientHeight});
  const w=dimensions.width,h=dimensions.height;
  if(!w||!h)return;
  const resized=canvas.width!==w||canvas.height!==h;
  if(!resized&&t-lastLakeFrame<33)return;
  lastLakeFrame=t;
  if(resized){canvas.width=w;canvas.height=h;}
  const ctx=lakePaint?.context||canvas.getContext('2d');
  if(reduceMotion){if(resized||!lakePaint?.paused)ctx.clearRect(0,0,w,h);if(lakePaint)lakePaint.paused=true;return;}
  if(!lakePaint||lakePaint.width!==w||lakePaint.height!==h){
    const scale=Math.max(w/image.naturalWidth,h/image.naturalHeight),rw=image.naturalWidth*scale,rh=image.naturalHeight*scale;
    lakePaint={width:w,height:h,scale,x:(w-rw)/2,context:ctx,shore:Math.ceil(rh*.62),paused:false};
  }
  lakePaint.paused=false;ctx.clearRect(0,0,w,h);
  const {shore,scale,x}=lakePaint;
  for(let y=shore;y<h;y+=3){
    const depth=(y-shore)/Math.max(1,h-shore),swell=Math.sin(y*.075-t/650)*(.6+depth*5)+Math.sin(y*.032+t/1300)*(depth*1.7);
    const lift=Math.abs(Math.sin(t/950+y*.05))*(.3+depth*1.8),band=Math.min(3,h-y);
    ctx.drawImage(image,(-x-swell)/scale,(y+lift)/scale,w/scale,band/scale,0,y,w,band);
  }
  ctx.lineCap='round';
  for(let i=0;i<34;i++){
    const depth=(i+.5)/34,yy=shore+(h-shore)*depth+Math.sin(t/850+i*1.7)*(1+depth*2);
    const span=(8+depth*24)*(w/700+.4),speed=5+depth*13;
    const xx=((i*137.7+t/1000*speed)%(w+span*2))-span;
    const pulse=.08+.17*(.5+.5*Math.sin(t/700+i*2.3));
    ctx.strokeStyle=`rgba(255,245,208,${pulse})`;ctx.lineWidth=.7+depth*1.1;
    ctx.beginPath();ctx.moveTo(xx,yy);ctx.quadraticCurveTo(xx+span*.5,yy-1.6,xx+span,yy);ctx.stroke();
  }
}
function drawWeather(t){
  weatherFrame=requestAnimationFrame(drawWeather);
  if(document.hidden||(typeof desktopOverlay!=='undefined'&&desktopOverlay&&!desktopBackground)||t-lastWeatherFrame<33)return;lastWeatherFrame=t;
  drawLake(t);
  const canvas=$('weatherCanvas');if(!canvas)return;
  const dimensions=sceneDimensions||(sceneDimensions={width:canvas.clientWidth,height:canvas.clientHeight});
  const w=dimensions.width,h=dimensions.height,resized=canvas.width!==w||canvas.height!==h;
  if(resized){canvas.width=w;canvas.height=h;}
  if(!weatherPaint)weatherPaint={context:canvas.getContext('2d'),weather:null,paused:false};
  if(!resized&&weatherPaint.weather===roomWeather&&(roomWeather==='clear'||(reduceMotion&&weatherPaint.paused)))return;
  const ctx=weatherPaint.context;ctx.clearRect(0,0,w,h);weatherPaint.weather=roomWeather;weatherPaint.paused=reduceMotion;
  if(reduceMotion)t=0;
  if(roomWeather!=='clear'){
    const snow=roomWeather==='snow',hail=roomWeather==='hail',speed=snow?18:hail?160:230;
    ctx.strokeStyle='rgba(224,241,247,.65)';ctx.fillStyle=snow?'#fffcf1dc':'#eef8f9d9';ctx.lineWidth=1;
    for(let i=0;i<(snow?45:65);i++){
      const x=((i*137.2+Math.sin(t/2000+i)*(snow?14:2))%Math.max(1,w)),yy=(i*71+t/1000*speed)%Math.max(1,h);
      if(snow||hail){ctx.beginPath();ctx.arc(x,yy,snow?1.8:2.6,0,Math.PI*2);ctx.fill();}
      else{ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x-4,yy+13);ctx.stroke();}
    }
  }
}
function setRoomControls(visible){
  document.body.classList.toggle('controls-visible',visible);

}
function initRoom(){
  document.body.append(document.querySelector('.cat-wall-clock'));
  let press=null;
  const isControl=target=>target.closest('button,a,input,select,label,.cat,[role="button"]');
  document.addEventListener('pointerdown',e=>{
    press=e.isPrimary&&e.button===0&&!isControl(e.target)?{id:e.pointerId,x:e.clientX,y:e.clientY}:null;
  });
  document.addEventListener('pointerup',e=>{
    if(press&&press.id===e.pointerId&&Math.hypot(e.clientX-press.x,e.clientY-press.y)<8&&!isControl(e.target))setRoomControls(!document.body.classList.contains('controls-visible'));
    press=null;
  });
  document.addEventListener('pointercancel',()=>{press=null;});
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){setRoomControls(false);$('roomScene').focus({preventScroll:true});}
    else if(e.key==='Tab')setRoomControls(true);
    else if((e.key==='Enter'||e.key===' ')&&e.target===$('roomScene')){e.preventDefault();setRoomControls(!document.body.classList.contains('controls-visible'));}
  });
  $('viewBtn').onclick=()=>{let n=0;for(const c of cats){if(n<3&&chooseRoomScenery(c,performance.now()))n++;}$('status').textContent=reduceMotion?'움직임을 켜면 아이들이 호수를 보러 가요.':'위쪽 캣워커에 나란히 앉아 호수를 바라봐요.';};
  $('friendsBtn').onclick=()=>{inviteRoomFriends();$('status').textContent='소양이, 소미, 팡이가 놀러 왔어요.';};
  $('closeControls').onclick=()=>setRoomControls(false);
  $('weather').onchange=e=>setRoomWeather(e.target.value);
  $('catBtn').addEventListener('click',()=>{$('catBtn').textContent=catsOn?'고양이 숨기기':'고양이 보이기';});
  $('restBtn').onclick=()=>{const t=performance.now();cats.forEach(c=>{if(!c.air&&!['angel','bubble'].includes(c.mode)){leave(c,t);if(!chooseFavorite(c,t))sleepNow(c,t);}});$('status').textContent='각자 좋아하는 폭신한 자리로 가요.';};
  $('wingsBtn').onclick=()=>{if(reduceMotion){$('status').textContent='움직임을 켜면 로이와 동글이가 날개를 펼쳐요.';return;}const t=performance.now();cats.filter(c=>['로이','동글이'].includes(c.name)).forEach(c=>{c.angelAfter=0;c.restUntil=0;if(!c.air)startAngelFlight(c,t);});};
  setRoomControls(false);updateRoomTime();setInterval(updateRoomTime,1000);
  if($('weatherCanvas')){
    const image=$('landscape');sceneDimensions={width:image.clientWidth,height:image.clientHeight};
    new ResizeObserver(entries=>{const r=entries[0].contentRect;sceneDimensions={width:Math.round(r.width),height:Math.round(r.height)};}).observe(image);
    weatherFrame=requestAnimationFrame(drawWeather);
  }
}

function pickIdle(c, t) {

function renderCatPosition(c) {

    c.el.style.transform=`translate(${c.x.toFixed(1)}px, ${(-c.y).toFixed(1)}px)`;
    c.renderedX=c.x;c.renderedY=c.y;
  }
  if(c.renderedDir!==c.dir||c.renderedScale!==c.scale){
    (c.flip||c.el.firstElementChild).style.transform=`scale(${(c.dir<0?-1:1)*c.scale}, ${c.scale})`;
    c.renderedDir=c.dir;c.renderedScale=c.scale;
  }

function installCatPointer(c) {

    c.el.setPointerCapture(e.pointerId);
  };
  c.el.onpointermove = e => {
    if (!press) return;
    if (!press.dragging && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 6) {
      press.dragging = true; leave(c, performance.now()); c.goal=null; c.edge=null; c.flight=null; c.air=false;

function renderCats() {

  $('catBtn').style.opacity = catsOn ? 1 : .45;
  let companions = state.pets.some(p => p.name === '동글이') ? state.pets : [...state.pets, { id: 'companion-dongle', name: '동글이', color: '#b7a690', memorial: true }];
  if (typeof roomGuestPets === 'function') companions = [...companions, ...roomGuestPets()];
  if(typeof petSeries==='function') {

  }

  if (sig === catSig) return;
  catSig = sig;
  const old = Object.fromEntries(cats.map(c => [c.id, c]));
  const retained = new Set(companions.map(p => p.id));
  cats.filter(c => !retained.has(c.id)).forEach(c => { leave(c, performance.now()); c.el.remove(); });
  cats = companions.map((p, i) => {
    const renderSig = p.name + p.color + catScaleFor(p,lookFor(p,i));

      until: performance.now() + rnd(2500, 9000) };

function tickCats(t) {
  requestAnimationFrame(tickCats);
  const dt = Math.min(.1, (t - lastT) / 1000 || 0); lastT = t;
  if (!catsOn || document.hidden) return;
  if (typeof tickRoomGuests === 'function') tickRoomGuests(t, dt);
  const max = Math.max(0, innerWidth - CAT_W), still = reduceMotion;
  const mouseOn = t - mouse.t < 2500 && mouse.x >= 0;
  const ground = innerHeight - 38;
  const hunters = mouseOn ? [...cats].sort((a, b) => Math.abs(a.x + CAT_W / 2 - mouse.x) - Math.abs(b.x + CAT_W / 2 - mouse.x)).slice(0, 2) : [];

  for (const c of cats) {
    const cx = c.x + CAT_W / 2;
    if (c.mode === 'bubble') { renderCatPosition(c); continue; }
    if (still) { c.mode = 'sleep'; }
    else if (['sleep','chin','house-low','house-top','hammock','sofa','bed'].includes(c.mode) && mouseOn && t - mouse.t < 300) {
      // 자다가 마우스가 움직이면 귀를 쫑긋 (가까운 고양이일수록 잘 깬다)
      const near = Math.abs(cx - mouse.x) < 420;
      if (Math.random() < dt * (near ? 3 : .8)) { c.earUntil = t + 1500; c.earDir = mouse.x < cx ? -1 : 1; }
    }
    else if (['walk', 'sit', 'loaf'].includes(c.mode) && hunters.includes(c) && !c.air && c.y < 20 && Math.random() < dt * .3) { startHunt(c, t); }

    // 시간이 다 되면 다음 행동
    if (t > c.until && !still) {
      if (c.mode === 'angel') finishAngelFlight(c, t);
      else if (c.mode === 'stretch' || c.mode === 'kiss' || c.mode === 'watch' || c.mode === 'scenery') pickIdle(c, t);
      else if (c.mode === 'sleep' || c.mode === 'chin') { setMode(c, 'stretch', t, 3000); }
      else if (c.mode === 'alert') {
        if (mouseOn && hunters.includes(c) && c.y < 20 && Math.random() < .35) startHunt(c, t);
        else if (Math.random() < .3 && highSpots().length) startZoom(c, t);
        else if (mouseOn && Math.random() < .5) setMode(c, 'alert', t, rnd(1200, 2000));
        else sleepNow(c, t);
      }
      else if (c.mode === 'loaf' && c.willPurr) { c.willPurr = false; c.noteAt = 0; setMode(c, 'purr', t, rnd(3500, 6000)); say(c, '골골골~ ♪', 1500); }
      else if (c.mode === 'knead') { if (Math.random() < .55) sleepNow(c, t); else pickIdle(c, t); }
      else if (c.mode === 'stalk' || c.mode === 'dash') setMode(c, 'sit', t, 1000);
      else if (c.mode === 'freeze') setMode(c, 'dash', t, 1500);
      else if (c.mode === 'chase' || c.mode === 'flee') { const p = c.partner; endPlay(c, t); if (p) endPlay(p, t); }
      else if (c.mode === 'run') { say(c, '헥헥…', 1500); setMode(c, 'sit', t, rnd(2000, 3500)); }
      else if (c.mode === 'pounce' || c.mode === 'jump') setMode(c, 'sit', t, 1000);
      else if (!c.air) pickIdle(c, t);
    }

    let pose = '';
    switch (c.mode) {
      case 'angel': {
        const a = c.angel;
        if (!a) { sleepNow(c, t); break; }
        const u = Math.max(0, Math.min(1, (t - a.start) / a.duration)), ease = u * u * (3 - 2 * u);
        c.x = a.x + (a.tx - a.x) * ease;
        c.y = a.y + (a.ty - a.y) * ease + Math.sin(Math.PI * u) * 75;
        c.dir = a.tx >= a.x ? 1 : -1; pose = 'angel'; break;
      }
      case 'stretch': pose = 'stretch'; break;
      case 'watch': pose = 'watch'; break;
      case 'scenery': pose = 'scenery'; break;
      case 'goScenery': {
        if (!c.sceneryGoal) { setMode(c,'sit',t,1000); break; }
        const dx=(c.sceneryX??c.sceneryGoal.xc)-cx;
        if(Math.abs(dx)<3) { c.goal=null;c.edge=null;setMode(c,'scenery',t,rnd(18000,32000));pose='scenery'; }
        else {c.dir=dx<0?-1:1;c.x+=c.dir*Math.min(Math.abs(dx),28*dt);pose='walking';}
        break;
      }
      case 'pawWrap': pose = 'watch paw-wrap'; break;
      case 'kiss': pose = 'watch kiss'; break;
      case 'goFavorite': {
        const dx = c.tx - cx;
        if (Math.abs(dx) < 4) {
          c.noteAt = 0; setMode(c, c.favorite, t, c.favorite === 'roll' ? 3600 : c.favorite === 'eat' ? 18000 : c.favorite.startsWith('house-') ? rnd(30000,50000) : rnd(6500, 11000));
          const words = { 'house-low': '호야의 1층 ♡', 'house-top': '같이 자자 ♡', tunnel: '빼꼼~ 여깄지 ♡', eat: '냠냠 ♡', bag: '바스락 바스락 ♡', box: '여기 딱 맞아~', basket: '내 자리 ♡', sofa: '새근새근…', chin: '턱 괴고… 쿨쿨', hammock: '해먹에서 새근새근…', bed: '폭신폭신…', roll: '데굴~' };
          say(c, words[c.favorite], 1600); break;
        }
        c.dir = dx < 0 ? -1 : 1; c.x += c.dir * Math.min(Math.abs(dx), 45 * dt); pose = 'walking'; break;
      }
      case 'bag': case 'box': case 'basket': pose = c.mode; break;
      case 'tunnel': pose = 'tunnel'; break;
      case 'eat': pose = 'eat'; break;
      case 'house-low': case 'house-top': case 'bed': case 'hammock': case 'sofa': case 'chin': pose = c.mode + ' sleep'; break;
      case 'roll': pose = 'roll'; break;
      case 'guestExit': case 'walk': c.x += c.dir * c.speed * (c.name === '보리' ? .66 : .82) * dt; pose = 'walking'; break;
      case 'loaf': pose = 'loaf'; break;
      case 'groom': pose = 'groom'; break;
      case 'sleep':
        pose = 'sleep';
        if (t > (c.noteAt || 0)) {
          c.noteAt = t + 2200 + rnd(0, 1500);
          const z = document.createElement('span'); z.className = 'note'; z.textContent = 'z'; z.style.fontSize = '12px';
          z.style.left = '40px'; c.el.appendChild(z); setTimeout(() => z.remove(), 1400);
        }
        break;
      case 'alert':
        pose = 'alert';
        if (mouseOn) c.dir = mouse.x < cx ? -1 : 1;
        break;
      case 'purr':
        pose = 'purr';
        if (t > (c.noteAt || 0)) {
          c.noteAt = t + 650;
          const n = document.createElement('span'); n.className = 'note'; n.textContent = '♪';
          n.style.left = rnd(12, 36) + 'px'; c.el.appendChild(n); setTimeout(() => n.remove(), 1400);
        }
        break;
      case 'goto': {   // 쿠션으로 가서 꾹꾹이
        const dx = c.tx - cx;
        if (Math.abs(dx) < 5) { c.noteAt = 0; setMode(c, 'knead', t, rnd(4500, 8000)); say(c, '꾹꾹꾹~', 1400); break; }
        c.dir = dx < 0 ? -1 : 1; c.x += c.dir * 60 * dt; pose = 'walking'; break;
      }
      case 'knead':
        pose = 'knead';
        if (t > (c.noteAt || 0)) {
          c.noteAt = t + 1100;
          const h = document.createElement('span'); h.className = 'note'; h.textContent = '♡';
          h.style.left = rnd(30, 44) + 'px'; c.el.appendChild(h); setTimeout(() => h.remove(), 1400);
        }
        break;
      case 'travel': {   // 목표 칸까지 걷거나 달리고 점프로 이동 (우다다 중이면 쉬지 않고 다음 칸으로)
        if (c.air) break;
        let here = nodeOf(c);
        if (!c.goal || here === c.goal) {
          if (c.sceneryGoal && here===c.sceneryGoal) { c.goal=null;c.edge=null;setMode(c,'goScenery',t,30000);break; }
          if (c.foodTarget && here === GROUND) { c.tx=c.foodTarget; c.foodTarget=null; c.favorite='eat'; c.goal=null; c.zoom=0; setMode(c,'goFavorite',t,30000); break; }
          if (c.cozy && here === c.cozy.platform) { c.tx = c.cozy.xc; c.goal = null; c.zoom = 0; setMode(c, 'goFavorite', t, 45000); break; }
          if (c.zoom > 1) {
            c.zoom--; const g = zoomGoal(c, here);
            if (g) { c.goal = g; c.edge = null; if (Math.random() < .3) say(c, SHOUTS[Math.floor(Math.random() * SHOUTS.length)], 900); }
          }
          if (!c.goal || here === c.goal) {
            if (c.zoom) say(c, '헥헥…', 1300);
            c.goal = null; c.zoom = 0; setMode(c, 'sit', t, rnd(900, 2200)); break;
          }
        }
        const goal = c.goal, run = c.zoom ? 1 : 0;
        if (!c.edge || c.edge.from !== here) {
          const d = distTo(goal), mine = d.get(here);
          const opts = mine == null ? [] : here.out.filter(e => d.get(e.to) < mine && !(c.blockedRoute?.until > t && c.blockedRoute.from === here && c.blockedRoute.to === e.to));
          if (!opts.length) { c.goal = null; c.zoom = 0; setMode(c, 'sit', t, 1000); break; }
          const e = c.edge = { ...opts[Math.floor(Math.random() * opts.length)], t0: t, progressAt: t, progressX: cx };

        }
        const e = c.edge, to = e.to;
        if (Math.abs(cx - e.progressX) > 6) { e.progressX = cx; e.progressAt = t; }
        if (t - e.progressAt > 3000) { c.goal = null; c.edge = null; c.zoom = 0; setMode(c, 'sit', t, 1000); break; }   // 실제 이동이 멈췄을 때만 쉬기 (긴 다리는 천천히 끝까지 걷는다)
        if (e.type === 'walk') {
          const dx = (to === GROUND ? (here.lowDir || 1) * 1e3 : to.xc - cx);
          c.dir = dx < 0 ? -1 : 1; c.x += c.dir * (run ? 115 : 30) * dt; pose = run ? 'walking fast' : 'walking';
        } else {
          const { lx, tx } = e.plan;
          const dx = lx - cx;
          if (Math.abs(dx) < .6) {
            if (!c.wind) c.wind = t + 160;   // 뛰기 전에 잠깐 웅크린다
            if (t < c.wind) { pose = 'crouch'; break; }
            c.wind = 0; c.x = lx - CAT_W / 2; c.y = hOf(here,lx); jumpTo(c, to, tx, t); c.edge = null; break;
          }
          c.dir = dx < 0 ? -1 : 1; c.x += c.dir * Math.min(Math.abs(dx), (run ? 125 : 36) * dt); pose = run ? 'walking fast' : 'walking';
        }
        break;
      }
      case 'goWheel': {   // 캣휠 안으로 들어가 달리기
        const dx = c.tx - cx;
        if (!wheel) { setMode(c, 'sit', t, 1000); break; }
        if (Math.abs(dx) < 5 && c.stand?.kind === 'wheel') { c.dir = 1; setMode(c, 'run', t, rnd(8000, 15000)); say(c, '두두두두!', 1400); break; }
        c.dir = dx < 0 ? -1 : 1; c.x += c.dir * 60 * dt; pose = 'walking'; break;
      }
      case 'run':   // 제자리 달리기 (바퀴 안에서 앞뒤로 조금씩 흔들림)
        if (!wheel) { setMode(c, 'sit', t, 1000); break; }
        c.x = wheel.xc - CAT_W / 2 + Math.sin(t / 95) * 1.5; pose = 'walking fast wheel-running'; break;
      case 'goScratch': {   // 캣타워 기둥 앞으로 가서 스크래칭
        const dx = c.tx - cx;
        if (Math.abs(dx) < 4) { c.x = c.tx - CAT_W / 2; c.noteAt = 0; setMode(c, 'scratch', t, rnd(4000, 7500)); say(c, '벅벅벅~', 1300); break; }
        c.dir = dx < 0 ? -1 : 1; c.x += c.dir * 70 * dt; pose = 'walking'; break;
      }
      case 'scratch':
        pose = 'scratch';
        if (t > (c.noteAt || 0)) {
          c.noteAt = t + 240;
          const f = document.createElement('span'); f.className = 'fluff'; f.textContent = '·';
          f.style.setProperty('--fx', (c.dir > 0 ? -1 : 1) * rnd(8, 22) + 'px'); f.style.left = rnd(24, 34) + 'px';
          c.el.appendChild(f); setTimeout(() => f.remove(), 800);
        }
        break;
      case 'stalk': {
        if (!mouseOn) { setMode(c, 'sit', t, 1000); break; }
        const dx = mouse.x - cx; c.dir = dx < 0 ? -1 : 1;
        if (Math.abs(dx) < 130) { setMode(c, 'freeze', t, 450); say(c, '...!', 500); break; }
        c.x += c.dir * 45 * dt; pose = 'walking crouch'; break;
      }
      case 'freeze': pose = 'crouch'; if (mouseOn) c.dir = mouse.x < cx ? -1 : 1; break;
      case 'dash': {
        const dx = mouse.x - cx; c.dir = dx < 0 ? -1 : 1;
        if (!mouseOn || Math.abs(dx) < 30) { pounce(c, t, ground - mouse.y - c.y); break; }
        c.x += c.dir * 190 * dt; pose = 'walking fast'; break;
      }
      case 'chase': case 'flee': {
        const p = c.partner;
        if (!p) { setMode(c, 'sit', t, 1000); break; }
        const dx = (p.x + CAT_W / 2) - cx;
        c.dir = (c.mode === 'chase' ? 1 : -1) * (dx < 0 ? -1 : 1);
        const atWall = c.mode === 'flee' && ((c.x <= 2 && c.dir < 0) || (c.x >= max - 2 && c.dir > 0));
        if (atWall) c.dir *= -1;   // 벽에 몰리면 반대로 빠져나감
        c.x += c.dir * (c.mode === 'chase' ? 120 : 105) * dt; pose = 'walking fast';
        if (c.mode === 'chase' && Math.abs(dx) < 26) {   // 잡았다! 술래 교대
          say(c, '잡았다!', 900); say(p, '으앗!', 900);
          c.mode = 'flee'; p.mode = 'chase';
          c.x += c.dir * -40;
        }
        break;
      }
    }
    if (c.x < 0) { c.x = 0; if (c.mode === 'walk') c.dir = 1; } else if (c.x > max) { c.x = max; if (c.mode === 'walk') c.dir = -1; }

    // 물리: 점프/낙하와 발판(쿠션·타워·다리·경사로) 위에 서기
    const fcx = c.x + CAT_W / 2;
    if (c.mode === 'angel') { /* 날개 비행은 곡선을 따라가고 도착할 때 발판에 내려앉는다. */ }
    else if (c.air) {
      const prevY = c.y;
      c.vy -= G * dt; c.y += c.vy * dt; c.x = Math.max(0, Math.min(max, c.x + c.vx * dt));
      if (c.vy < 0) {
        const p = floorAt(c.x + CAT_W / 2, prevY, 1), fy = p ? hOf(p, c.x + CAT_W / 2) : 0;
        if (c.y <= fy) { c.y = fy; c.vy = 0; c.vx = 0; c.air = false; c.stand = p; c.landT = t; onLand(c, t); }
      }
    } else {
      let p;
      if(c.supportLayout===layoutRevision&&c.supportX===fcx&&c.supportY===c.y)p=c.supportPlatform;
      else {p=floorAt(fcx,c.y,14);c.supportLayout=layoutRevision;c.supportX=fcx;c.supportY=c.y;c.supportPlatform=p;}
      const fy = p ? hOf(p, fcx) : 0, d = fy - c.y;
      if (Math.abs(d) <= 14) c.y = Math.abs(d) < .6 ? fy : c.y + Math.sign(d) * Math.min(Math.abs(d), 220 * dt);
      else { c.air = true; c.vy = 0; c.vx = 0; }   // 발판 가장자리를 벗어나면 떨어짐
      c.stand = p;
    }
    if (c.air) pose = 'air ' + (c.vy > 0 ? 'rise' : 'fall');


    if (['watch','pawWrap'].includes(c.mode) && mouseOn && Math.abs(mouse.x - cx) < 130 && Math.random() < dt * .4) setMode(c, 'kiss', t, 2800);
    const cls = 'cat ' + c.lookCls + (c.earUntil > t ? ' airplane-ears' + (c.earDir < 0 ? ' ear-left' : ' ear-right') : '') + (c.name === '보리' ? ' tiger-walk' : '') + (c.cozy && c.mode === c.favorite ? ' at-cozy' : '') + ' ' + (c.mode === 'sit' && !c.air ? '' : pose) + (t - (c.landT || -1e9) < 200 && !c.air ? ' land' : '') + (pose.includes('crouch') || c.mode === 'freeze' ? ' crouch' : '');
    if (cls !== c.cls) { c.cls = cls; c.el.className = cls; }
    renderCatPosition(c);
  }
  if(wheel){const spinning=cats.some(c=>c.mode==='run');if(spinning!==wheel.spinning){wheel.el.classList.toggle('spin',spinning);wheel.spinning=spinning;}}
}
$('catBtn').onclick = () => {
  catsOn = !catsOn;
  try { localStorage.setItem(KEY + ':cats', catsOn ? 'on' : 'off'); } catch (e) {}
  renderCats();
};
let resizeT;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(layoutProps, 200); });
layoutProps();
requestAnimationFrame(tickCats);


renderCats();
initRoom();
</script></body></html>
