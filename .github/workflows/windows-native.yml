name: Validate small Windows desktop
on:
  push:
    branches: ['codex/small-windows']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        edition: [default, park, kim]
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      HORIBBANGU_EDITION: ${{ matrix.edition }}
      HORIBBANGU_NATIVE_TEST_BUILD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: ${{ runner.temp }}/hori-native
          key: windows-zig-0.15.2-webview2-1.0.4258.31-v1
      - name: Build from source with pinned tools (read-only repository access)
        shell: pwsh
        run: |
          curl.exe --fail --location 'https://ziglang.org/download/0.15.2/zig-x86_64-windows-0.15.2.zip' --output "$env:RUNNER_TEMP\zig.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Compiler download failed' }
          if ((Get-FileHash "$env:RUNNER_TEMP\zig.zip" -Algorithm SHA256).Hash.ToLower() -ne '3a0ed1e8799a2f8ce2a6e6290a9ff22e6906f8227865911fb7ddedc3cc14cb0c') { throw 'Compiler checksum mismatch' }
          Expand-Archive "$env:RUNNER_TEMP\zig.zip" "$env:RUNNER_TEMP\zig"
          $env:ZIG = "$env:RUNNER_TEMP\zig\zig-x86_64-windows-0.15.2\zig.exe"
          $env:HORIBBANGU_NATIVE_CACHE = "$env:RUNNER_TEMP\hori-native"
          npm ci --ignore-scripts
          python desktop/windows/build-playground.py --edition ${{ matrix.edition }}
          if ($LASTEXITCODE -ne 0) { throw 'Renderer build failed' }
          python desktop/windows/native/build.py --edition ${{ matrix.edition }}
          if ($LASTEXITCODE -ne 0) { throw 'Native build failed' }
          & $env:ZIG c++ -std=c++17 desktop/windows/native/test_startup_policy.cpp -o startup-policy-test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Startup policy test build failed' }
          .\startup-policy-test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Startup retry bounds failed' }
          & $env:ZIG c++ -std=c++17 desktop/windows/native/test_saver_args.cpp -o saver-args-test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Screensaver argument test build failed' }
          .\saver-args-test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Screensaver argument parsing failed' }
          python desktop/windows/native/test_binary.py --edition ${{ matrix.edition }}
          if ($LASTEXITCODE -ne 0) { throw 'Binary validation failed' }
          $edition = '${{ matrix.edition }}'
          $folder = if ($edition -eq 'default') { 'build/windows-native' } else { "build/windows-native-$edition" }
          $manifest = Get-Content "$folder/manifest.json" -Raw | ConvertFrom-Json
          Copy-Item "$folder/$($manifest.exe)" candidate.exe
      - name: Prepare isolated test dependencies
        shell: pwsh
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.58.2
          python -m pip install pillow==12.1.1
          $runtime = Get-ChildItem "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application\*\msedgewebview2.exe" -ErrorAction SilentlyContinue
          if (-not $runtime) {
            curl.exe --fail --location 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' --output "$env:RUNNER_TEMP\WebView2Setup.exe"
            if ($LASTEXITCODE -ne 0) { throw 'Runtime download failed' }
            $signature = Get-AuthenticodeSignature "$env:RUNNER_TEMP\WebView2Setup.exe"
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*Microsoft Corporation*') { throw 'Invalid Microsoft signature' }
            $installer = Start-Process "$env:RUNNER_TEMP\WebView2Setup.exe" -ArgumentList '/silent','/install' -Wait -PassThru
            if ($installer.ExitCode -ne 0) { throw 'Runtime installation failed' }
          }
      - name: Exercise actual Win32 host and WebView2
        shell: pwsh
        env:
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: --remote-debugging-port=9223
          HORIBBANGU_NATIVE_DIAGNOSTICS: '1'
        run: |
          # Elevated CI runners ignore WEBVIEW2_* environment overrides (runtime 150+).
          # Apply Microsoft's supported policy only to these two disposable test EXEs.
          $policy = 'HKLM:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $policy -Force | Out-Null
          try {
            foreach ($exe in @('candidate.exe','cats.exe')) {
              New-ItemProperty -Path $policy -Name $exe -Value '--remote-debugging-port=9223' -PropertyType String -Force | Out-Null
            }
            python desktop/windows/native/test_windows.py
            if ($LASTEXITCODE -ne 0) { throw 'Native runtime validation failed' }
            python desktop/windows/native/test_interactive.py
            if ($LASTEXITCODE -ne 0) { throw 'Topmost interaction validation failed' }
            python desktop/windows/native/test_screensaver.py
            if ($LASTEXITCODE -ne 0) { throw 'Screensaver validation failed' }
          } finally {
            foreach ($exe in @('candidate.exe','cats.exe')) {
              Remove-ItemProperty -Path $policy -Name $exe -ErrorAction SilentlyContinue
            }
          }
      - uses: actions/cache/save@v4
        if: always() && steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/hori-native
          key: windows-zig-0.15.2-webview2-1.0.4258.31-v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-verification-${{ matrix.edition }}
          path: |
            build/native-verification*/
            build/windows-native*/*.exe
            build/windows-native*/manifest.json
