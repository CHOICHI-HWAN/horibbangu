    font-size: 12px; padding: 2px 8px; border-radius: 8px; white-space: nowrap; animation: pop var(--d, 1.2s) forwards; }
  .cat .note { position: absolute; bottom: 34px; left: 22px; color: var(--c); font-size: 15px; animation: floatup 1.4s forwards; }
  .cat .leg { transform-box: fill-box; transform-origin: top center; }
  .cat.walking .l1, .cat.walking .l4 { animation: step .5s infinite; }
  .cat.walking .l2, .cat.walking .l3 { animation: step .5s infinite reverse; }
  .cat.fast.walking .leg { animation-duration: .24s; }
  .cat .tail { transform-box: fill-box; transform-origin: 100% 100%; animation: sway 1.6s ease-in-out infinite; }
  .cat.crouch .tail { animation-duration: .3s; }
  @keyframes step { 0%, 100% { transform: rotate(24deg); } 50% { transform: rotate(-24deg); } }
  @keyframes sway { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(14deg); } }
  @keyframes buzz { 0%, 100% { transform: translateX(-.6px); } 50% { transform: translateX(.6px); } }
  @keyframes pop { 0% { opacity: 0; } 12%, 78% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes floatup { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-34px); } }

  /* 포근한 인형 비율과 아이마다 다른 표정 */
  .cat .head { transform-origin: 50% 65%; }
  .cat .eyes { animation: cat-blink 7s infinite; transform-box: fill-box; transform-origin: center; }
  .cat.dongle .head { transform: translate(-1px, 2px) scale(1.08, .91); }
  .cat .exotic-ears, .cat .flat-nose { display: none; }
  .cat.dongle .exotic-ears, .cat.dongle .flat-nose { display: inline; }
  .cat.dongle .ear, .cat.dongle .ear-inner, .cat.dongle .nose { display: none; }
  .cat.dongle .mouth { transform: translateY(-2px); }
  .cat.dongle .m { opacity: 0; }
  .cat.dongle .cap { transform: translateY(-3px); }
  .cat .norwegian-ruff, .cat .norwegian-tufts { display: none; }
  .cat.roy .norwegian-ruff, .cat.roy .norwegian-tufts { display: inline; }
  .cat.roy .ruff { display: none; }
  .cat .salgu-ruff { display: none; }
  .cat.salgu .salgu-ruff { display: inline; }
  .cat.salgu .ruff { display: none; }
  .cat.salgu .cheek { transform: translate(-4px, -2px) scale(1.09, 1.12); }
  .cat.salgu .coat-fluff { transform: translate(-1px, -2px) scale(1.06, 1.1); }
  .cat.salgu .tail-outline { stroke-width: 12; }
  .cat.salgu .tailp { stroke-width: 10.6; }
  .cat.roy .stripes { opacity: .3; }
  .cat .favorite-prop { display: none; }
  .cat.bag .bag-prop, .cat.box .box-prop, .cat.basket .basket-prop,
  .cat.sofa .sofa-prop, .cat.chin .chin-prop { display: inline; }
  .cat.box .all, .cat.basket .all { transform: translateY(8px) scale(.94, .82); }
  .cat.box .leg, .cat.basket .leg, .cat.bag .leg { opacity: 0; }
  .cat.box .tail, .cat.basket .tail { opacity: 0; }
  .cat.bag .all { transform: translateY(3px) scaleY(.94); }
  .cat.bag .bag-prop { animation: crinkle 1.7s ease-in-out infinite; transform-origin: 30px 40px; }
  .cat.sofa.sleep svg .all { transform: translate(-2px, 1px) scale(1.07, .78); }
  .cat.sofa .head { transform: translate(3px, 7px) rotate(12deg); }
  .cat.chin.sleep svg .all { transform: translateY(4px) scaleY(.88); }
  .cat.chin .head { transform: translate(2px, 7px) rotate(6deg); }
  .cat.chin .tail, .cat.sofa .tail { animation-duration: 5s; }
  .cat.roll svg .all { transform-origin: 31px 30px; animation: tummy-roll 3.6s ease-in-out both; }
  .cat.roll .leg { animation: paw-wiggle .7s ease-in-out infinite alternate; }
  .cat.roll .tail { animation-duration: .6s; }
  @keyframes cat-blink { 0%, 43%, 47%, 100% { transform: scaleY(1); } 45% { transform: scaleY(.08); } }
  @keyframes crinkle { 0%, 100% { transform: skewX(-2deg); } 50% { transform: skewX(2deg) scaleX(1.03); } }
  @keyframes tummy-roll { 0%, 100% { transform: rotate(0); } 22% { transform: translateY(5px) rotate(-165deg); } 38%, 65% { transform: translateY(5px) rotate(-185deg); } 78% { transform: translateY(5px) rotate(-155deg); } }
  @keyframes paw-wiggle { from { transform: rotate(-12deg); } to { transform: rotate(15deg); } }

  .cat { z-index: 2; }
  .cozy { position: absolute; width: 80px; height: 56px; pointer-events: none; }
  .cozy svg { width: 80px; height: 56px; overflow: visible; }
  .cozy-back { z-index: 1; }
  .cozy-front { z-index: 3; }
  .cat.at-cozy .favorite-prop { display: none; }
  .cat.bed.sleep svg .all { transform: translateY(5px) scale(1.03, .8); }
  .cat.hammock.sleep svg .all { transform: translate(0, 8px) scale(.9, .76); }
  .cat.hammock .leg, .cat.hammock .tail { opacity: 0; }
  .cat.hammock .head { transform: translate(-4px, 4px) rotate(10deg); }

  .cat .angel-wings { display: none; }
  .cat.angel { z-index: 4; }
  .cat.angel .angel-wings { display: inline; }
  .cat.angel .all { transform: rotate(-5deg); }
  .cat.angel .wing { transform-box: fill-box; transform-origin: 50% 100%; animation: angel-flap 1.4s ease-in-out infinite; }
  .cat.angel .wing-right { animation-direction: reverse; }
  @keyframes angel-flap { 0%, 100% { transform: rotate(-10deg) scaleX(.85); } 50% { transform: rotate(10deg) scaleX(1.1); } }
  #cats.motion-paused .cat * { animation: none !important; }

.cat.walking .head { animation-duration:1s; }
.cat.walking .leg { animation-duration:.95s; }
.cat.walking.fast .head,.cat.walking.fast .leg { animation-duration:.38s; }
.cat.tiger-walk.walking:not(.fast) .all { animation:tiger-roll 1.6s ease-in-out infinite; }
@keyframes tiger-roll { 50% { transform:translateY(1px) rotate(.8deg); } }
.cat.air.rise svg .all { transform:rotate(-11deg) scaleX(1.1); }
.cat.air.rise .l1,.cat.air.rise .l3 { transform:rotate(45deg) translateY(-1px); }
.cat.air.rise .l2,.cat.air.rise .l4 { transform:rotate(-36deg); }

.cat.air.fall .l2,.cat.air.fall .l4 { transform:translate(-1px,3px) rotate(-4deg); }
.cat.air.fall .l1,.cat.air.fall .l3 { transform:rotate(30deg) translateY(-3px); }
.cat.land svg .all { transform:translate(2px,2px) rotate(4deg) scaleY(.94); }
.cat.land .l2,.cat.land .l4 { transform:scaleY(.65); }
.cat.watch .all { transform:translateY(-1px) scaleX(.9) scaleY(1.03); }
.cat.watch .head { transform:translateX(-6px) scale(1.15); }
.cat.watch .eyes { animation:cat-blink 8s infinite; }
.cat.kiss .eyes { animation:eye-kiss 2.8s ease-in-out; }
@keyframes eye-kiss { 0%,100% { transform:scaleY(1); } 32%,65% { transform:scaleY(.08); } }
.cat.stretch .all { animation:cat-stretch 3s ease-in-out; }
.cat.stretch .l2,.cat.stretch .l4 { transform:rotate(-50deg); }
.cat.stretch .tail { transform:rotate(-32deg); }
@keyframes cat-stretch { 20%,70% { transform:translate(-4px,3px) scale(1.2,.72) rotate(5deg); } }
.cat.airplane-ears .ear,.cat.airplane-ears .ear-inner { transform:rotate(-32deg) scaleY(.7); }
.cat.airplane-ears .exotic-ears { transform:rotate(-12deg); transform-origin:46px 20px; }
.cat.ear-right .ear,.cat.ear-right .ear-inner { transform:rotate(28deg) scaleY(.7); }
.cat.in-bubble { z-index:15!important; cursor:grabbing; }
.cat.in-bubble::after { content:''; position:absolute; inset:-20px -15px -14px; border-radius:50%; border:1.5px solid #ffffffd9; background:radial-gradient(ellipse at 27% 20%,#ffffffa8 0 3%,transparent 14%),linear-gradient(125deg,#b9eff64a,#eccce851,#fff9); box-shadow:inset 0 0 13px #c9f2ff94,0 5px 15px #72b4be30; pointer-events:none; }
.cat.tunnel .flip { transform:translateY(-22px) scale(.95)!important; }
.cat.tunnel { clip-path:ellipse(24px 19px at 44px 0px); }
.cat.tunnel .all { transform:translate(-2px,7px); }
.cat.tunnel .leg,.cat.tunnel .tail { opacity:0; }
.cat.house-low .all,.cat.house-top .all { transform:translateY(5px) scale(1.02,.8); }
.cat.house-low .leg,.cat.house-top .leg { opacity:0; }
.cat.bus-passenger { visibility:hidden; }
#cats.motion-paused .cat * { animation:none!important; }

.cat.tunnel .head { animation:peek-hole 8s ease-in-out infinite; }
@keyframes peek-hole { 0%,18%,90%,100% { transform:translateY(14px); } 30%,72% { transform:translateY(-4px); } }
.cat.eat .head { animation:nom-nom 1.5s ease-in-out infinite; }
@keyframes nom-nom { 50% { transform:translate(2px,5px) rotate(12deg); } }

.cat .tail-scarf { display:none; }
.cat.paw-wrap .tail { display:none; }
.cat.paw-wrap .tail-scarf { display:inline; }
.cat.paw-wrap .all { transform:translateY(1px) scaleX(.92); }
.cat.fluffy.paw-wrap .tail-scarf path:nth-child(2) { stroke-width:8; }

.cat .eyes { animation-delay:var(--blink-delay,0s); }

function updateRoomTime(date=new Date()){
  const hour=date.getHours()+date.getMinutes()/60+date.getSeconds()/3600;
  const daylight=hour>=6&&hour<18, progress=((hour-(daylight?6:18)+24)%24)/12;
  const x=10+Math.min(1,progress)*80, top=40-Math.sin(Math.min(1,progress)*Math.PI)*33;
  const night=hour<5||hour>=20?1:hour<7?(7-hour)/2:hour>17?(hour-17)/3:0;
  const root=document.documentElement;root.style.setProperty('--night',Math.max(0,Math.min(1,night)).toFixed(3));
  root.style.setProperty('--reflection-x',x+'%');
  root.style.setProperty('--sun-angle',`${-30+progress*60}deg`);root.style.setProperty('--warmth',daylight?(hour<9||hour>16?.85:.4):.04);
  for(const[id,visible]of[['sun',daylight],['moon',!daylight]]){$(id).hidden=!visible;$(id).style.left=x+'%';$(id).style.top=top+'%';}
  $('clockHour').setAttribute('transform',`rotate(${(hour%12)*30} 60 78)`);
  $('clockMinute').setAttribute('transform',`rotate(${(date.getMinutes()+date.getSeconds()/60)*6} 60 78)`);
  $('catClockText').textContent=date.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});
  $('roomClock').textContent=date.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})+(night>.7?' · 달빛의 방':hour>16?' · 노을의 방':' · 호수의 방');
  document.body.dataset.time=night>.7?'night':'day';
  $('rain-friend').classList.toggle('visible',roomWeather==='rain'&&date.getMinutes()%20<12);
  const dateKey=`${date.getFullYear()}-${date.getMonth()+1}-${date.getDate()}-${Math.floor(hour*2)}`;
  if(dateKey!==lastRoomDate){lastRoomDate=dateKey;if(weatherChoice==='auto')setRoomWeather('auto',date);}
}
function setRoomWeather(choice,date=new Date()){
  weatherChoice=choice;
  if(choice==='auto'){
    // A stable, half-hour story-weather slot shared by reloads; no location permission.
    const key=Math.floor(date.getTime()/1800000), value=((key*9301+49297)%233280)/233280;
    roomWeather=value<.62?'clear':value<.88?'rain':value<.98?'snow':'hail';
  }else roomWeather=choice;
  document.body.dataset.weather=roomWeather;

function drawWeather(t){
  if(reduceMotion)t=0;
  tickRoomEvents();
  const canvas=$('weatherCanvas'),ctx=canvas.getContext('2d'),rect=canvas.getBoundingClientRect();
  if(canvas.width!==Math.round(rect.width)||canvas.height!==Math.round(rect.height)){canvas.width=Math.round(rect.width);canvas.height=Math.round(rect.height);}
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(roomWeather!=='clear'){
    const snow=roomWeather==='snow',hail=roomWeather==='hail',speed=snow?18:hail?160:230;
    ctx.strokeStyle='rgba(224,241,247,.65)';ctx.fillStyle=snow?'#fffcf1dc':'#eef8f9d9';ctx.lineWidth=1;
    for(let i=0;i<(snow?45:65);i++){
      const x=((i*137.2+Math.sin(t/2000+i)*(snow?14:2))%Math.max(1,canvas.width));
      const yy=(i*71+t/1000*speed)%Math.max(1,canvas.height);
      if(snow||hail){ctx.beginPath();ctx.arc(x,yy,snow?1.8:2.6,0,Math.PI*2);ctx.fill();}
      else{ctx.beginPath();ctx.moveTo(x,yy);ctx.lineTo(x-4,yy+13);ctx.stroke();}
    }
  }
  weatherFrame=requestAnimationFrame(drawWeather);
}

  const dy = hOf(p, tx) - c.y, vy = Math.sqrt(2 * G * (Math.max(dy, 0) + 16));
  const tf = (vy + Math.sqrt(Math.max(0, vy * vy - 2 * G * dy))) / G;

  c.dir = c.vx < 0 ? -1 : (c.vx > 0 ? 1 : c.dir); c.vy = vy; c.y += .5; c.air = true; c.stand = null;
  setMode(c, 'jump', t, 5000);
}
function startPlay(c, t) {
  const idle = cats.filter(o => o !== c && grounded(o) && ['walk', 'sit', 'loaf'].includes(o.mode));
  if (!idle.length || !grounded(c)) { setMode(c, 'sit', t, 1500); return; }
  const o = idle[Math.floor(Math.random() * idle.length)];
  const dur = rnd(6000, 9000);
  c.partner = o; o.partner = c;
  setMode(c, 'chase', t, dur); setMode(o, 'flee', t, dur);
  say(c, '잡는다!', 1000); say(o, '꺄악~', 1000);
}
function endPlay(c, t) { c.partner = null; setMode(c, 'sit', t, rnd(1200, 2500)); }

function pounce(c, t, h) {
  c.vy = Math.sqrt(2 * G * Math.max(25, Math.min(110, h) + 15));
  c.vx = c.dir * 130; c.y += .5; c.air = true; c.stand = null; setMode(c, 'pounce', t, 3000);
}
function leave(c, t) { c.cozy = null; if (c.mode === 'angel') { c.angel = null; c.air = true; c.vy = 0; c.vx = 0; } if (c.partner) { c.partner.partner = null; setMode(c.partner, 'sit', t, 1500); c.partner = null; } }
function onLand(c, t) {
  if (c.mode === 'pounce') {
    const hit = t - mouse.t < 2500 && Math.abs(mouse.x - (c.x + CAT_W / 2)) < 45;
    say(c, hit ? '잡았다! 챱!' : '앗 놓쳤다…', 1300);
    setMode(c, 'sit', t, 1300);

}

function renderCatPosition(c) {
  c.el.style.transform = `translate(${c.x.toFixed(1)}px, ${(-c.y).toFixed(1)}px)`;
}
function installCatPointer(c) {
  let press = null;

  c.el.onpointerdown = e => {
    if (e.button !== 0 || c.mode === 'busRide') return;
    press = { x: e.clientX, y: e.clientY, dx: e.clientX - c.x, dy: e.clientY + c.y, dragging: false, pointerId: e.pointerId };
    c.el.setPointerCapture(e.pointerId);
  };
  c.el.onpointermove = e => {
    if (!press) return;
    if (!press.dragging && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 6) {
      press.dragging = true; leave(c, performance.now()); c.goal=null; c.edge=null; c.flight=null; c.air=false;
      setMode(c, 'bubble', performance.now(), Infinity); c.el.classList.add('in-bubble');
    }
    if (press.dragging) {
      c.x=Math.max(0, Math.min(innerWidth-CAT_W, e.clientX-press.dx));
      c.y=Math.max(0, Math.min(innerHeight-70, press.dy-e.clientY)); renderCatPosition(c);

}

function renderCats() {
  $('cats').hidden = !catsOn;
  $('catBtn').style.opacity = catsOn ? 1 : .45;
  const companions = state.pets.some(p => p.name === '동글이') ? state.pets : [...state.pets, { id: 'companion-dongle', name: '동글이', color: '#b7a690', memorial: true }];
  if(typeof petSeries==='function') {
    try { localStorage.setItem('horibbangu-cat-sizes-v1',JSON.stringify(Object.fromEntries(companions.map((p,i)=>[p.name,catScaleFor(p,lookFor(p,i))])))); } catch(e) {}
  }
  const sig = companions.map((p,i) => p.id + p.color + p.name + catScaleFor(p,lookFor(p,i))).join('|');
  if (sig === catSig) return;
  catSig = sig;
  const old = Object.fromEntries(cats.map(c => [c.id, c]));
  cats.forEach(c => leave(c, 0));
  $('cats').querySelectorAll('.cat').forEach(e => e.remove());
  cats = companions.map((p, i) => {
    const c = old[p.id] || { id: p.id, x: Math.random() * Math.max(0, innerWidth - CAT_W), y: 0, vy: 0, vx: 0, air: false, stand: null,
      dir: Math.random() < .5 ? 1 : -1, speed: rnd(22, 50), mode: Math.random() < .35 ? 'sleep' : 'watch',
      until: performance.now() + rnd(2500, 9000) };
    if (!['walk', 'sit', 'watch', 'loaf', 'purr', 'sleep', 'alert', 'groom'].includes(c.mode)) c.mode = 'sit';
    c.cls = ''; c.partner = null;
    const look = lookFor(p, i);
    c.name = p.name; c.lookCls = look.cls; c.scale = catScaleFor(p,look);
    c.el = document.createElement('div');
    c.el.className = 'cat ' + c.lookCls;
    c.el.style.setProperty('--c', p.color);
    c.el.style.setProperty('--blink-delay',(-i*.83)+'s');
    for (const [k, v] of Object.entries(look)) if (k !== 'cls' && k !== 'scale') c.el.style.setProperty('--' + k, v);
    c.el.title = p.memorial ? '동글이 · 늘 함께하는 친구' : p.name;
    c.el.innerHTML = `<div class="flip">${CAT_SVG.replaceAll('__CAT__', 'cat-' + i)}</div>`;
    installCatPointer(c);
    c.el.onclick = () => {
      if (performance.now() < (c.ignoreClickUntil || 0)) return;
      if (c.mode === 'watch' || c.mode === 'pawWrap' || c.mode === 'kiss') { setMode(c, 'kiss', performance.now(), 2800); return; }   // 쓰다듬기: 골골송
      leave(c, performance.now());
      c.noteAt = 0; setMode(c, 'purr', performance.now(), 4500);
      say(c, p.name + ' 골골골~ ♪', 1800);
      if (!p.memorial) selectPet(p.id);

  });
}

function tickCats(t) {
  requestAnimationFrame(tickCats);
  const dt = Math.min(.1, (t - lastT) / 1000 || 0); lastT = t;
  if (!catsOn || document.hidden) return;
  const max = Math.max(0, innerWidth - CAT_W), still = reduceMotion;
  const mouseOn = t - mouse.t < 2500 && mouse.x >= 0;
  const ground = innerHeight - 38;
  const hunters = mouseOn ? [...cats].sort((a, b) => Math.abs(a.x + CAT_W / 2 - mouse.x) - Math.abs(b.x + CAT_W / 2 - mouse.x)).slice(0, 2) : [];

  for (const c of cats) {
    const cx = c.x + CAT_W / 2;
    if (c.mode === 'bubble' || c.mode === 'busRide') { renderCatPosition(c); continue; }
    if (still) { c.mode = 'sleep'; }
    else if (['sleep','chin','house-low','house-top','hammock','sofa','bed'].includes(c.mode) && mouseOn && t - mouse.t < 300) {
      // 자다가 마우스가 움직이면 귀를 쫑긋 (가까운 고양이일수록 잘 깬다)
      const near = Math.abs(cx - mouse.x) < 420;
      if (Math.random() < dt * (near ? 3 : .8)) { c.earUntil = t + 1500; c.earDir = mouse.x < cx ? -1 : 1; }
    }
    else if (['walk', 'sit', 'loaf'].includes(c.mode) && hunters.includes(c) && !c.air && c.y < 20 && Math.random() < dt * .3) { startHunt(c, t); }

    // 시간이 다 되면 다음 행동
    if (t > c.until && !still) {
      if (c.mode === 'angel') finishAngelFlight(c, t);
      else if (c.mode === 'stretch' || c.mode === 'kiss' || c.mode === 'watch') pickIdle(c, t);
      else if (c.mode === 'sleep' || c.mode === 'chin') { setMode(c, 'stretch', t, 3000); }
      else if (c.mode === 'alert') {
        if (mouseOn && hunters.includes(c) && c.y < 20 && Math.random() < .35) startHunt(c, t);
        else if (Math.random() < .3 && highSpots().length) startZoom(c, t);
        else if (mouseOn && Math.random() < .5) setMode(c, 'alert', t, rnd(1200, 2000));
        else sleepNow(c, t);
      }
      else if (c.mode === 'loaf' && c.willPurr) { c.willPurr = false; c.noteAt = 0; setMode(c, 'purr', t, rnd(3500, 6000)); say(c, '골골골~ ♪', 1500); }
      else if (c.mode === 'knead') { if (Math.random() < .55) sleepNow(c, t); else pickIdle(c, t); }
      else if (c.mode === 'stalk' || c.mode === 'dash') setMode(c, 'sit', t, 1000);
      else if (c.mode === 'freeze') setMode(c, 'dash', t, 1500);
      else if (c.mode === 'chase' || c.mode === 'flee') { const p = c.partner; endPlay(c, t); if (p) endPlay(p, t); }
      else if (c.mode === 'run') { say(c, '헥헥…', 1500); setMode(c, 'sit', t, rnd(2000, 3500)); }
      else if (c.mode === 'pounce' || c.mode === 'jump') setMode(c, 'sit', t, 1000);
      else if (!c.air) pickIdle(c, t);
    }

    let pose = '';
    switch (c.mode) {
      case 'angel': {
        const a = c.angel;
        if (!a) { sleepNow(c, t); break; }
        const u = Math.max(0, Math.min(1, (t - a.start) / a.duration)), ease = u * u * (3 - 2 * u);
        c.x = a.x + (a.tx - a.x) * ease;
        c.y = a.y + (a.ty - a.y) * ease + Math.sin(Math.PI * u) * 75;
        c.dir = a.tx >= a.x ? 1 : -1; pose = 'angel'; break;
      }
      case 'stretch': pose = 'stretch'; break;
      case 'watch': pose = 'watch'; break;
      case 'pawWrap': pose = 'watch paw-wrap'; break;
      case 'kiss': pose = 'watch kiss'; break;
      case 'goFavorite': {
        const dx = c.tx - cx;
        if (Math.abs(dx) < 4) {
          c.noteAt = 0; setMode(c, c.favorite, t, c.favorite === 'roll' ? 3600 : c.favorite === 'eat' ? 18000 : c.favorite.startsWith('house-') ? rnd(30000,50000) : rnd(6500, 11000));
          const words = { 'house-low': '호야의 1층 ♡', 'house-top': '같이 자자 ♡', tunnel: '빼꼼~ 여깄지 ♡', eat: '냠냠 ♡', bag: '바스락 바스락 ♡', box: '여기 딱 맞아~', basket: '내 자리 ♡', sofa: '새근새근…', chin: '턱 괴고… 쿨쿨', hammock: '해먹에서 새근새근…', bed: '폭신폭신…', roll: '데굴~' };
          say(c, words[c.favorite], 1600); break;
        }
        c.dir = dx < 0 ? -1 : 1; c.x += c.dir * Math.min(Math.abs(dx), 45 * dt); pose = 'walking'; break;
      }
      case 'bag': case 'box': case 'basket': pose = c.mode; break;
      case 'tunnel': pose = 'tunnel'; break;
      case 'eat': pose = 'eat'; break;
      case 'house-low': case 'house-top': case 'bed': case 'hammock': case 'sofa': case 'chin': pose = c.mode + ' sleep'; break;
      case 'roll': pose = 'roll'; break;
      case 'walk': c.x += c.dir * c.speed * (c.name === '보리' ? .66 : .82) * dt; pose = 'walking'; break;
      case 'loaf': pose = 'loaf'; break;
      case 'groom': pose = 'groom'; break;
      case 'sleep':
        pose = 'sleep';
        if (t > (c.noteAt || 0)) {
          c.noteAt = t + 2200 + rnd(0, 1500);
          const z = document.createElement('span'); z.className = 'note'; z.textContent = 'z'; z.style.fontSize = '12px';
          z.style.left = '40px'; c.el.appendChild(z); setTimeout(() => z.remove(), 1400);
        }
        break;
      case 'alert':
        pose = 'alert';
        if (mouseOn) c.dir = mouse.x < cx ? -1 : 1;
        break;
      case 'purr':
        pose = 'purr';
        if (t > (c.noteAt || 0)) {
          c.noteAt = t + 650;
          const n = document.createElement('span'); n.className = 'note'; n.textContent = '♪';
          n.style.left = rnd(12, 36) + 'px'; c.el.appendChild(n); setTimeout(() => n.remove(), 1400);
        }
        break;
      case 'goto': {   // 쿠션으로 가서 꾹꾹이
        const dx = c.tx - cx;
        if (Math.abs(dx) < 5) { c.noteAt = 0; setMode(c, 'knead', t, rnd(4500, 8000)); say(c, '꾹꾹꾹~', 1400); break; }
        c.dir = dx < 0 ? -1 : 1; c.x += c.dir * 60 * dt; pose = 'walking'; break;
      }
      case 'knead':
        pose = 'knead';
        if (t > (c.noteAt || 0)) {
          c.noteAt = t + 1100;
          const h = document.createElement('span'); h.className = 'note'; h.textContent = '♡';
          h.style.left = rnd(30, 44) + 'px'; c.el.appendChild(h); setTimeout(() => h.remove(), 1400);
        }
        break;
      case 'travel': {   // 목표 칸까지 걷거나 달리고 점프로 이동 (우다다 중이면 쉬지 않고 다음 칸으로)
        if (c.air) break;
        let here = nodeOf(c);
        if (!c.goal || here === c.goal) {
          if (c.foodTarget && here === GROUND) { c.tx=c.foodTarget; c.foodTarget=null; c.favorite='eat'; c.goal=null; c.zoom=0; setMode(c,'goFavorite',t,30000); break; }
          if (c.cozy && here === c.cozy.platform) { c.tx = c.cozy.xc; c.goal = null; c.zoom = 0; setMode(c, 'goFavorite', t, 45000); break; }
          if (c.zoom > 1) {
            c.zoom--; const g = zoomGoal(c, here);
            if (g) { c.goal = g; c.edge = null; if (Math.random() < .3) say(c, SHOUTS[Math.floor(Math.random() * SHOUTS.length)], 900); }
          }
          if (!c.goal || here === c.goal) {
            if (c.zoom) say(c, '헥헥…', 1300);
            c.goal = null; c.zoom = 0; setMode(c, 'sit', t, rnd(900, 2200)); break;
          }
        }
        const goal = c.goal, run = c.zoom ? 1 : 0;
        if (!c.edge || c.edge.from !== here) {
          const d = distTo(goal), mine = d.get(here);
          const opts = mine == null ? [] : here.out.filter(e => d.get(e.to) < mine && !(c.blockedRoute?.until > t && c.blockedRoute.from === here && c.blockedRoute.to === e.to));
          if (!opts.length) { c.goal = null; c.zoom = 0; setMode(c, 'sit', t, 1000); break; }
          const e = c.edge = { ...opts[Math.floor(Math.random() * opts.length)], t0: t, progressAt: t, progressX: cx };

        }
        const e = c.edge, to = e.to;
        if (Math.abs(cx - e.progressX) > 6) { e.progressX = cx; e.progressAt = t; }
        if (t - e.progressAt > 3000) { c.goal = null; c.edge = null; c.zoom = 0; setMode(c, 'sit', t, 1000); break; }   // 실제 이동이 멈췄을 때만 쉬기 (긴 다리는 천천히 끝까지 걷는다)
        if (e.type === 'walk') {
          const dx = (to === GROUND ? (here.lowDir || 1) * 1e3 : to.xc - cx);
          c.dir = dx < 0 ? -1 : 1; c.x += c.dir * (run ? 115 : 30) * dt; pose = run ? 'walking fast' : 'walking';
        } else {
          const { lx, tx } = e.plan;
          const dx = lx - cx;
          if (Math.abs(dx) < .6) {
            if (!c.wind) c.wind = t + 160;   // 뛰기 전에 잠깐 웅크린다
            if (t < c.wind) { pose = 'crouch'; break; }
            c.wind = 0; c.x = lx - CAT_W / 2; c.y = hOf(here,lx); jumpTo(c, to, tx, t); c.edge = null; break;
          }
          c.dir = dx < 0 ? -1 : 1; c.x += c.dir * Math.min(Math.abs(dx), (run ? 125 : 36) * dt); pose = run ? 'walking fast' : 'walking';
        }
        break;
      }
      case 'goWheel': {   // 캣휠 안으로 들어가 달리기
        const dx = c.tx - cx;
        if (!wheel) { setMode(c, 'sit', t, 1000); break; }
        if (Math.abs(dx) < 5 && c.stand?.kind === 'wheel') { c.dir = 1; setMode(c, 'run', t, rnd(6000, 12000)); say(c, '두두두두!', 1400); break; }
        c.dir = dx < 0 ? -1 : 1; c.x += c.dir * 60 * dt; pose = 'walking'; break;
      }
      case 'run':   // 제자리 달리기 (바퀴 안에서 앞뒤로 조금씩 흔들림)
        if (!wheel) { setMode(c, 'sit', t, 1000); break; }
        c.x = wheel.xc - CAT_W / 2 + Math.sin(t / 160) * 6; pose = 'walking fast'; break;
      case 'goScratch': {   // 캣타워 기둥 앞으로 가서 스크래칭
        const dx = c.tx - cx;
        if (Math.abs(dx) < 4) { c.x = c.tx - CAT_W / 2; c.noteAt = 0; setMode(c, 'scratch', t, rnd(4000, 7500)); say(c, '벅벅벅~', 1300); break; }
        c.dir = dx < 0 ? -1 : 1; c.x += c.dir * 70 * dt; pose = 'walking'; break;
      }
      case 'scratch':
        pose = 'scratch';
        if (t > (c.noteAt || 0)) {
          c.noteAt = t + 240;
          const f = document.createElement('span'); f.className = 'fluff'; f.textContent = '·';
          f.style.setProperty('--fx', (c.dir > 0 ? -1 : 1) * rnd(8, 22) + 'px'); f.style.left = rnd(24, 34) + 'px';
          c.el.appendChild(f); setTimeout(() => f.remove(), 800);
        }
        break;
      case 'stalk': {
        if (!mouseOn) { setMode(c, 'sit', t, 1000); break; }
        const dx = mouse.x - cx; c.dir = dx < 0 ? -1 : 1;
        if (Math.abs(dx) < 130) { setMode(c, 'freeze', t, 450); say(c, '...!', 500); break; }
        c.x += c.dir * 45 * dt; pose = 'walking crouch'; break;
      }
      case 'freeze': pose = 'crouch'; if (mouseOn) c.dir = mouse.x < cx ? -1 : 1; break;
      case 'dash': {
        const dx = mouse.x - cx; c.dir = dx < 0 ? -1 : 1;
        if (!mouseOn || Math.abs(dx) < 30) { pounce(c, t, ground - mouse.y - c.y); break; }
        c.x += c.dir * 190 * dt; pose = 'walking fast'; break;
      }
      case 'chase': case 'flee': {
        const p = c.partner;
        if (!p) { setMode(c, 'sit', t, 1000); break; }
        const dx = (p.x + CAT_W / 2) - cx;
        c.dir = (c.mode === 'chase' ? 1 : -1) * (dx < 0 ? -1 : 1);
        const atWall = c.mode === 'flee' && ((c.x <= 2 && c.dir < 0) || (c.x >= max - 2 && c.dir > 0));
        if (atWall) c.dir *= -1;   // 벽에 몰리면 반대로 빠져나감
        c.x += c.dir * (c.mode === 'chase' ? 120 : 105) * dt; pose = 'walking fast';
        if (c.mode === 'chase' && Math.abs(dx) < 26) {   // 잡았다! 술래 교대
          say(c, '잡았다!', 900); say(p, '으앗!', 900);
          c.mode = 'flee'; p.mode = 'chase';
          c.x += c.dir * -40;
        }
        break;
      }
    }
    if (c.x < 0) { c.x = 0; if (c.mode === 'walk') c.dir = 1; } else if (c.x > max) { c.x = max; if (c.mode === 'walk') c.dir = -1; }

    // 물리: 점프/낙하와 발판(쿠션·타워·다리·경사로) 위에 서기
    const fcx = c.x + CAT_W / 2;
    if (c.mode === 'angel') { /* 날개 비행은 곡선을 따라가고 도착할 때 발판에 내려앉는다. */ }
    else if (c.air) {
      const prevY = c.y;
      c.vy -= G * dt; c.y += c.vy * dt; c.x = Math.max(0, Math.min(max, c.x + c.vx * dt));
      if (c.vy < 0) {
        const p = floorAt(c.x + CAT_W / 2, prevY, 1), fy = p ? hOf(p, c.x + CAT_W / 2) : 0;
        if (c.y <= fy) { c.y = fy; c.vy = 0; c.vx = 0; c.air = false; c.stand = p; c.landT = t; onLand(c, t); }
      }
    } else {
      const p = floorAt(fcx, c.y, 14), fy = p ? hOf(p, fcx) : 0, d = fy - c.y;
      if (Math.abs(d) <= 14) c.y = Math.abs(d) < .6 ? fy : c.y + Math.sign(d) * Math.min(Math.abs(d), 220 * dt);
      else { c.air = true; c.vy = 0; c.vx = 0; }   // 발판 가장자리를 벗어나면 떨어짐
      c.stand = p;
    }
    if (c.air) pose = 'air ' + (c.vy > 0 ? 'rise' : 'fall');
    if (wheel && c === cats[0]) wheel.el.classList.toggle('spin', cats.some(o => o.mode === 'run'));

    if (['watch','pawWrap'].includes(c.mode) && mouseOn && Math.abs(mouse.x - cx) < 130 && Math.random() < dt * .4) setMode(c, 'kiss', t, 2800);
    const cls = 'cat ' + c.lookCls + (c.earUntil > t ? ' airplane-ears' + (c.earDir < 0 ? ' ear-left' : ' ear-right') : '') + (c.name === '보리' ? ' tiger-walk' : '') + (c.cozy && c.mode === c.favorite ? ' at-cozy' : '') + ' ' + (c.mode === 'sit' && !c.air ? '' : pose) + (t - (c.landT || -1e9) < 200 && !c.air ? ' land' : '') + (pose.includes('crouch') || c.mode === 'freeze' ? ' crouch' : '');
    if (cls !== c.cls) { c.cls = cls; c.el.className = cls; }
    c.el.style.transform = `translate(${c.x.toFixed(1)}px, ${(-c.y).toFixed(1)}px)`;
    c.el.firstChild.style.transform = `scale(${(c.dir < 0 ? -1 : 1) * c.scale}, ${c.scale})`;
  }
}
$('catBtn').onclick = () => {
  catsOn = !catsOn;
  try { localStorage.setItem(KEY + ':cats', catsOn ? 'on' : 'off'); } catch (e) {}
  renderCats();
};
let resizeT;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(layoutProps, 200); });
layoutProps();
requestAnimationFrame(tickCats);


renderCats();
initRoom();
</script></body></html>
