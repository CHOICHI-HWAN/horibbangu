* { box-sizing:border-box; }
body { margin:0; height:100dvh; overflow:hidden; color:var(--ink); font:14px/1.5 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:var(--wall); }

/* Open balcony: one uninterrupted landscape, with sheer curtains and a low clear rail. */
.balcony-opening {left:17%;width:66%;top:8%;height:62%;padding:9px;border-radius:20px 20px 5px 5px;box-shadow:0 11px 0 #c8bdab,0 20px 35px #8c735722;}

.balcony-opening::before {left:-18px;clip-path:polygon(0 0,100% 0,70% 70%,92% 100%,10% 97%);}

.balcony-rail::after {content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 73px,#eeeadaaa 74px 76px,transparent 77px 150px);}
.balcony-step {position:absolute;left:15.5%;width:69%;top:68.5%;height:5.8%;background:repeating-linear-gradient(90deg,transparent 0 90px,#c3b8a43b 91px 92px),linear-gradient(#e3ddcd,#cbc3b1);clip-path:polygon(2.5% 0,97.5% 0,100% 100%,0 100%);box-shadow:0 4px #b7ab96;}
.art-wall {width:12%;gap:22px;} .art-left{left:2.5%;}.art-right{right:2.5%;}

 .balcony-opening{left:7%;width:86%;top:27%;height:42%;padding:6px;border-radius:12px 12px 4px 4px;}

/* A quiet scene by default; controls are revealed by a background tap or keyboard. */
.room-header,.login-link,.scene-label,.weather-control {display:none;pointer-events:none;}
.controls-visible .room-header,.controls-visible .login-link,.controls-visible .scene-label,.controls-visible .weather-control {display:flex;}
.controls-visible .login-link,.controls-visible .weather-control,.controls-visible .header-actions {pointer-events:auto;}
.room:focus-visible {outline:2px solid #a2ad87;outline-offset:-5px;}
.room {--wall:#f3ebd9;background:radial-gradient(ellipse at 62% 37%,#fff8e499,transparent 60%),linear-gradient(95deg,#d7d3b21a,transparent 27%,transparent 75%,#d4b98c18),var(--wall);}
.floor {background:repeating-linear-gradient(91deg,transparent 0 17%,#947c4f26 17.08% 17.2%),linear-gradient(#b6a580,#d6c39c 7%,#e7d4b0);border-top-color:#e8ddbe;}
.sunbeam {background:linear-gradient(110deg,#fff6c965,#f8c56a00 77%);filter:blur(7px);}
.painting {background:linear-gradient(125deg,#98805b,#d6bf8b 45%,#a28b5e);box-shadow:1px 3px 7px #64563c24;}
.room-page .room-furniture svg,.room-page .cozy svg {filter:drop-shadow(0 1px 1px #6d62441a);}
.room-page .cat> .flip >svg {filter:drop-shadow(0 1.2px .7px #5b563519);}
button,.login-link,.download-link,.weather-control select {background:#fff9e8de;border-color:#a99a704c;color:#58644c;box-shadow:0 1px 0 #fffbe6;}
@media(prefers-reduced-motion:reduce){.room-header,.login-link,.scene-label,.weather-control{transition:none;}}

.room::before {content:"";position:absolute;inset:0;z-index:8;pointer-events:none;opacity:.18;mix-blend-mode:multiply;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22180%22%20height%3D%22180%22%3E%3Cfilter%20id%3D%22n%22%3E%3CfeTurbulence%20type%3D%22fractalNoise%22%20baseFrequency%3D%22.7%22%20numOctaves%3D%223%22%20stitchTiles%3D%22stitch%22%2F%3E%3CfeColorMatrix%20type%3D%22saturate%22%20values%3D%220%22%2F%3E%3C%2Ffilter%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%20filter%3D%22url%28%23n%29%22%20opacity%3D%22.15%22%2F%3E%3C%2Fsvg%3E");}

/* A gentle camera breath and independently rippling painted water. */
.landscape-motion {position:absolute;inset:0;transform-origin:50% 0;animation:landscape-breathe 32s ease-in-out infinite;}
#lakeCanvas {position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
@keyframes landscape-breathe {0%,100%{transform:scale(1.003);}50%{transform:scale(1.018);}}
.shimmer {top:65%;height:35%;opacity:.28;animation:lake-light 7s ease-in-out infinite;}
@keyframes lake-light {0%,100%{transform:translateX(-5px) scaleX(.9);opacity:.18;}50%{transform:translateX(6px) scaleX(1.08);opacity:.36;}}
[data-motion="paused"] .landscape-motion,[data-motion="paused"] .shimmer {animation:none;}

/* Clouds and mountain mist drift independently over the painted landscape. */
#landscapeAir {position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:hidden;}
.sky-cloud,.mountain-mist {transform-box:view-box;transform-origin:center;}
.cloud-near {animation:cloud-drift 46s ease-in-out infinite alternate;animation-delay:-15s;}
.cloud-far {opacity:.65;animation:cloud-drift 68s ease-in-out infinite alternate-reverse;animation-delay:-34s;}
.mist-high {animation:mist-drift 35s ease-in-out infinite alternate;animation-delay:-11s;}
.mist-low {opacity:.8;animation:mist-drift 47s ease-in-out infinite alternate-reverse;animation-delay:-24s;}
@keyframes cloud-drift {from{transform:translate(-34px,0);}to{transform:translate(55px,6px);}}
@keyframes mist-drift {from{transform:translate(-65px,4px);opacity:.5;}to{transform:translate(60px,-6px);opacity:.95;}}
[data-motion="paused"] .sky-cloud,[data-motion="paused"] .mountain-mist {animation-play-state:paused;}

/* A small paper calendar on the wall, updated from the device's local date. */
.wall-calendar {position:absolute;right:4.2%;top:12px;width:106px;padding:8px 7px 7px;border:1px solid #c5b18d;border-radius:3px 3px 8px 3px;background:linear-gradient(105deg,#fff9e9,#f1e7cd);box-shadow:1px 4px 5px #72604724;transform:rotate(2deg);color:#6b6853;pointer-events:none;}
.calendar-rings {position:absolute;top:-5px;left:22%;right:22%;height:9px;background:repeating-linear-gradient(90deg,#958674 0 2px,transparent 2px 13px);border-radius:2px;}
.calendar-header {display:flex;flex-direction:column;align-items:center;border-bottom:1px solid #d6c4a1;padding:2px 0 5px;gap:2px;}
.calendar-caption {font-size:6px;color:#aa8c69;letter-spacing:1px;}
#calendarMonth {font-size:11px;color:#727e62;font-family:Georgia,'Apple SD Gothic Neo',serif;white-space:nowrap;}
.calendar-weekdays,.calendar-days {display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:8px;line-height:15px;}
.calendar-weekdays {font-size:7px;color:#9a917a;padding-top:3px;}
.calendar-days>span {min-height:15px;}
.calendar-weekdays>span:first-child,.calendar-days>span:nth-child(7n+1) {color:#b78271;}
.calendar-weekdays>span:last-child,.calendar-days>span:nth-child(7n) {color:#7b9296;}
.calendar-days .calendar-today {border-radius:50%;background:#819073;color:#fff9e6!important;box-shadow:0 0 0 1px #6b7c5a44;}
@media(max-width:650px){.wall-calendar{right:3%;top:7.5%;width:72px;padding:5px 4px 4px;}.calendar-caption{font-size:4px;letter-spacing:.5px;}#calendarMonth{font-size:8px;}.calendar-header{padding-bottom:2px;gap:0;}.calendar-weekdays,.calendar-days{font-size:6px;line-height:9px;}.calendar-days>span{min-height:9px;}.calendar-weekdays{font-size:5px;padding-top:2px;}.calendar-rings{height:7px;top:-4px;}}
@media(max-height:500px){.wall-calendar{top:8px;right:4%;width:70px;padding:4px;}.calendar-caption{display:none;}#calendarMonth{font-size:8px;}.calendar-weekdays,.calendar-days{font-size:6px;line-height:8px;}.calendar-days>span{min-height:8px;}}

  #cats { position: fixed; left: 0; right: 0; bottom: 0; top: 0; pointer-events: none; z-index: 5; overflow: hidden; }
  #cats[hidden] { display: none; }
  .cat { position: absolute; left: 0; bottom: 2px; width: 64px; height: 44px; pointer-events: auto; cursor: pointer; will-change: transform; }
  .cat .flip { width: 64px; height: 44px; }
  .cat svg { width: 64px; height: 44px; overflow: visible; display: block; color: var(--c); }
  .cat svg .all { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .25s; }
  .cat.loaf svg .all, .cat.purr svg .all, .cat.sleep svg .all { transform: translateY(6px) scaleY(.8) scaleX(1.06); }
  .cat.crouch svg .all { transform: translateY(5px) scaleY(.86); }
  .cat.air svg .all, .cat.land svg .all { transition-duration: .1s; }
  .cat.air.rise svg .all { transform: rotate(-9deg) scaleX(1.07) scaleY(.94); }          /* 도약: 몸을 길게 뻗는다 */
  .cat.air.rise .l2, .cat.air.rise .l4 { transform: rotate(-52deg); }                    /* 앞다리는 앞으로 */
  .cat.air.rise .l1, .cat.air.rise .l3 { transform: rotate(46deg); }                     /* 뒷다리는 뒤로 */
  .cat.air.fall svg .all { transform: rotate(2deg); }                                   /* 하강: 몸을 수평으로 */
  .cat.air.fall .l2, .cat.air.fall .l4 { transform: rotate(-10deg); }                    /* 네 발을 아래로 모은다 */
  .cat.air.fall .l1, .cat.air.fall .l3 { transform: rotate(9deg); }
  .cat.land svg .all { transform: translateY(5px) scaleY(.85) scaleX(1.05); }           /* 착지: 네 발이 같이 닿으며 살짝 눌림 */
  .cat.loaf .leg, .cat.purr .leg, .cat.sleep .leg { opacity: 0; }
  .cat svg { transform-origin: 50% 100%; }
  .cat.purr svg { animation: buzz .14s infinite; }
  .cat.sleep svg { animation: breathe 3.2s ease-in-out infinite; }
  #props { position: absolute; inset: 0; pointer-events: none; }
  .cushion { position: absolute; bottom: 3px; width: 64px; height: 15px; border-radius: 12px 12px 7px 7px;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.13), 0 1px 0 rgba(0,0,0,.18); }
  .cushion::after { content: ''; position: absolute; left: 7px; right: 7px; top: 5px; border-top: 1.5px dashed rgba(255,255,255,.65); }
  .tower { position: absolute; bottom: 0; width: 130px; opacity: .94; }
  .bridges { position: absolute; left: 0; bottom: 0; }
  .cat .head { transform-box: fill-box; transform-origin: 40% 100%; transition: transform .2s; }
  .cat.groom .head { transform: rotate(32deg); animation: lick .5s ease-in-out infinite; }
  .cat.groom .l4 { transform: rotate(-68deg); animation: lickleg .5s ease-in-out infinite; }
  .cat.knead .l3 { animation: press .55s ease-in-out infinite; }
  .cat.knead .l4 { animation: press .55s ease-in-out infinite reverse; }
  .cat.knead svg { animation: bob .55s ease-in-out infinite; }
  @keyframes lick { 0%, 100% { transform: rotate(28deg); } 50% { transform: rotate(40deg); } }
  @keyframes lickleg { 0%, 100% { transform: rotate(-72deg); } 50% { transform: rotate(-58deg); } }
  @keyframes press { 0%, 100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-2px) scaleY(.55); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(1.5px); } }
  .cat.scratch svg .all { transform-origin: 25% 100%; transform: rotate(-58deg); }
  .cat.scratch svg { animation: scrw .4s ease-in-out infinite; }
  .cat.scratch .l3 { animation: scr .4s ease-in-out infinite; }
  .cat.scratch .l4 { animation: scr .4s ease-in-out infinite reverse; }
  .cat .fluff { position: absolute; bottom: 30px; left: 28px; font-size: 13px; color: #c9a27a; animation: fluff .8s forwards; }
  @keyframes scr { 0%, 100% { transform: translateY(-3px); } 50% { transform: translateY(3px); } }
  @keyframes scrw { 0%, 100% { transform: translateX(-.8px); } 50% { transform: translateX(.8px); } }
  @keyframes fluff { from { opacity: 1; transform: translate(0, 0); } to { opacity: 0; transform: translate(var(--fx, -14px), 12px); } }
  .wheel { position: absolute; bottom: 0; left: 14px; width: 120px; height: 124px; }
